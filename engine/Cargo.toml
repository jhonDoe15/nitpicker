[package]
name = "nitpicker-engine"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.2"
tree-sitter-java = "0.23.5"
regex = "1"
sha2 = "0.10"
walkdir = "2"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
oxc_allocator = "0.159.0"
oxc_parser = "0.159.0"
oxc_ast = { version = "0.159.0", features = ["serialize"] }
oxc_span = "0.159.0"
oxc_semantic = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_syntax = "0.159.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
