[package]
name = "nitpicker-engine"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.2"
tree-sitter-java = "0.23.5"
regex = "1"
fancy-regex = "0.14"
walkdir = "2"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
