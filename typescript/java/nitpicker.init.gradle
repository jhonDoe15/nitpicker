// Nitpicker Java preset (slice 1). Applied with `gradle -I typescript/java/nitpicker.init.gradle nitpickerJava`
// so the consumer build needs no edits and the base snapshot can be analyzed the same way.
// Every tool version is pinned exactly; bump them here only.
//
// Output contract (relative to each project directory), read by the Nitpicker side:
//   build/nitpicker/pmd.sarif        PMD, SARIF 2.1.0
//   build/nitpicker/spotbugs.sarif   SpotBugs, SARIF 2.1.0
//   build/nitpicker/format.txt       google-java-format --dry-run: one file needing a reformat per line
//   build/nitpicker/jacoco.xml       JaCoCo XML report
//   build/nitpicker/manifest.json    tool versions and the source roots the reports are relative to

def pinned = [
    pmd             : '7.7.0',
    spotbugs        : '4.9.3',
    googleJavaFormat: '1.25.2',
    jacoco          : '0.8.12',
]

allprojects {
    plugins.withId('java') {
        pluginManager.apply('jacoco')

        def reportDir = layout.buildDirectory.dir('nitpicker')

        configurations {
            nitpickerPmd { canBeConsumed = false }
            nitpickerSpotbugs { canBeConsumed = false }
            nitpickerFormat { canBeConsumed = false }
        }
        repositories { mavenCentral() }
        dependencies {
            nitpickerPmd "net.sourceforge.pmd:pmd-cli:${pinned.pmd}"
            nitpickerPmd "net.sourceforge.pmd:pmd-java:${pinned.pmd}"
            nitpickerSpotbugs "com.github.spotbugs:spotbugs:${pinned.spotbugs}"
            nitpickerFormat "com.google.googlejavaformat:google-java-format:${pinned.googleJavaFormat}"
        }
        jacoco { toolVersion = pinned.jacoco }

        def mainSources = sourceSets.main.allJava.sourceDirectories

        tasks.register('nitpickerPmd', JavaExec) {
            group = 'nitpicker'
            classpath = configurations.nitpickerPmd
            mainClass = 'net.sourceforge.pmd.cli.PmdCli'
            ignoreExitValue = true // PMD exits 4 when it finds violations
            def rulesetFile = rootProject.file('config/pmd/ruleset.xml')
            def ruleset = rulesetFile.exists() ? rulesetFile.absolutePath
                : 'category/java/errorprone.xml,category/java/bestpractices.xml'
            doFirst {
                reportDir.get().asFile.mkdirs()
                args 'check', '--no-cache', '--no-progress', '--format', 'sarif',
                    '--report-file', reportDir.get().file('pmd.sarif').asFile.absolutePath,
                    '--rulesets', ruleset,
                    '--dir', mainSources.files.findAll { it.exists() }.join(',')
            }
        }

        tasks.register('nitpickerSpotbugs', JavaExec) {
            group = 'nitpicker'
            dependsOn tasks.named('classes')
            classpath = configurations.nitpickerSpotbugs
            mainClass = 'edu.umd.cs.findbugs.FindBugs2'
            ignoreExitValue = true
            doFirst {
                reportDir.get().asFile.mkdirs()
                def sourcePath = mainSources.files.findAll { it.exists() }.join(File.pathSeparator)
                def classDirs = sourceSets.main.output.classesDirs.files.findAll { it.exists() }
                args(['-effort:default', '-medium', '-sarif',
                      '-output', reportDir.get().file('spotbugs.sarif').asFile.absolutePath,
                      '-sourcepath', sourcePath] + classDirs.collect { it.absolutePath })
            }
        }

        tasks.register('nitpickerFormat', JavaExec) {
            group = 'nitpicker'
            classpath = configurations.nitpickerFormat
            mainClass = 'com.google.googlejavaformat.java.Main'
            ignoreExitValue = true
            jvmArgs(['api', 'file', 'parser', 'tree', 'util', 'code'].collect {
                "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString()
            })
            doFirst {
                reportDir.get().asFile.mkdirs()
                standardOutput = new FileOutputStream(reportDir.get().file('format.txt').asFile)
                def files = mainSources.asFileTree.matching { include '**/*.java' }.files.sort()
                args(['--dry-run'] + files*.absolutePath)
            }
        }

        tasks.register('nitpickerJacoco') {
            group = 'nitpicker'
            dependsOn tasks.named('test'), tasks.named('jacocoTestReport')
            doLast {
                copy {
                    from tasks.named('jacocoTestReport').get().reports.xml.outputLocation
                    into reportDir
                    rename { 'jacoco.xml' }
                }
            }
        }
        tasks.named('jacocoTestReport') {
            reports { xml.required = true }
        }

        tasks.register('nitpickerJava') {
            group = 'nitpicker'
            description = 'Runs PMD, SpotBugs, the formatter check and JaCoCo; reports go to build/nitpicker.'
            dependsOn 'nitpickerPmd', 'nitpickerSpotbugs', 'nitpickerFormat', 'nitpickerJacoco'
            doLast {
                def roots = mainSources.files.collect {
                    project.projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/')
                }
                reportDir.get().file('manifest.json').asFile.text = groovy.json.JsonOutput.toJson([
                    versions   : pinned,
                    sourceRoots: roots,
                ])
            }
        }
    }
}
