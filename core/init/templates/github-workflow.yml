name: '{{NAME}}'

on:
  pull_request:

permissions:
  contents: read

jobs:
  nitpicker:
    runs-on: ubuntu-latest
    defaults: '{{DEFAULTS}}'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: '{{ENVIRONMENT_STEPS}}'
      - run: '{{INSTALL_STEPS}}'
      - name: nitpicker
        uses: '{{ACTION}}'
        with:
          '{{GATE_INPUTS}}': ''
          node-version: ''
          install-command: none
          accept-policy-change: ${{ vars.NITPICKER_ACCEPT_POLICY_CHANGE }}
