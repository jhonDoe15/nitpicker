def tooling = project.ext.nitpickerKotlinTooling
def pinned = tooling.pinned
def nitpickerArgument = tooling.argument
def nitpickerStyle = tooling.style
def reportDir = tooling.reportDir
def analysisRoot = tooling.analysisRoot
def initScriptDir = tooling.initScriptDir
def kotlinLintedDirs = tooling.lintedDirs
def detektJdkHome = tooling.jdkHome
def detekt = tooling.detekt

configurations {
    nitpickerDetekt { canBeConsumed = false }
    nitpickerDetektStdlib { canBeConsumed = false }
}
dependencies {
    nitpickerDetekt("io.gitlab.arturbosch.detekt:detekt-cli:${pinned.detekt}:all") { transitive = false }
    nitpickerDetektStdlib("org.jetbrains.kotlin:kotlin-stdlib:${pinned.detektKotlin}") { transitive = false }
}

// detekt reports through SARIF. Three configs are layered, the last winning: detekt's defaults
// (--build-upon-default-config), the project's config (nitpicker.kotlin.detektConfig, chosen on the
// Nitpicker side), and Nitpicker's languages/java/detekt/nitpicker-detekt.yml, so the one-way rules
// cannot be switched off from the project's file; a rule the project sets active: false stays off
// and one it omits runs with its default. nitpicker.kotlin.detektLists, when the Nitpicker side wrote
// one, follows Nitpicker's file and carries only the ForbiddenMethodCall.methods list, Nitpicker's
// entries plus the project's own (detekt replaces a list instead of merging it).
// languages/java/detekt/detekt-validation.yml comes last
// and turns config validation off: the project's file may configure rulesets of plugins that this
// detekt run does not load (formatting), and validation would end the run with exit code 3 on them.
// --includes '**/*.kt' keeps .kts scripts (precompiled Gradle plugins) out: detekt's type resolution
// crashes on them. Exit code 2 means findings; anything else is a failure.
// Type resolution: the rules of nitpicker-detekt.yml and several default ones need it. The
// classpath is the module's main and test compile classpaths plus the compiled Java classes, with the
// project's kotlin-stdlib replaced by the one detekt itself embeds (pinned.detektKotlin):
// detekt 1.23 cannot read the metadata of a newer Kotlin standard library, and then every
// call to it stays unresolved. Libraries built with a newer Kotlin than detekt's stay
// unresolved too, so rules report less there. --jdk-home makes JDK types resolve: it is the project's Gradle
// Java toolchain JDK when the project declares one (java.toolchain, kotlin.jvmToolchain), else the JDK
// that runs Gradle.
tasks.register('nitpickerDetektLayers') {
    group = 'nitpicker'
    def layersFile = new File(temporaryDir, 'layers.txt')
    ext.layersFile = layersFile
    doLast {
        def conventions = new File(temporaryDir, 'followed-conventions.yml')
        conventions.text = nitpickerStyle().detektConventions ?: ''
        def enforced = new File(temporaryDir, 'enforced-conventions.yml')
        enforced.text = nitpickerStyle().detektEnforced ?: ''
        def paths = [conventions: conventions.absolutePath,
                     project    : nitpickerArgument('nitpicker.kotlin.detektConfig'),
                     enforced   : enforced.absolutePath]
        def names = (nitpickerArgument('nitpicker.kotlin.detektLayers') ?: '').toString()
            .split(',')*.trim().findAll { it }
        layersFile.text = names.collect { paths[it] }.findAll { it }.collect { it + '\n' }.join('')
    }
}

tasks.register('nitpickerDetekt', JavaExec) {
    group = 'nitpicker'
    classpath = configurations.nitpickerDetekt
    mainClass = 'io.gitlab.arturbosch.detekt.cli.Main'
    ignoreExitValue = true
    def report = reportDir.map { it.file('detekt.sarif') }
    def log = new ByteArrayOutputStream()
    def nitpickerConfig = new File(initScriptDir, '../detekt/nitpicker-detekt.yml').canonicalFile
    def validationOff = new File(initScriptDir, '../detekt/detekt-validation.yml').canonicalFile
    dependsOn detekt.dependencies
    onlyIf { !kotlinLintedDirs().isEmpty() && detekt.enabled() }
    dependsOn 'nitpickerDetektLayers'
    def runningJdk = JavaVersion.current().majorVersion as int
    def detektNewestJdk = 21
    def detektOldestJdk = 17
    def detektLauncher = null
    def chooseDetektLauncher = {
        if (detektLauncher == null) {
            def failure = null
            for (int version = detektNewestJdk;
                 version >= detektOldestJdk && detektLauncher == null; version--) {
                try {
                    def candidate = project.extensions.getByType(JavaToolchainService).launcherFor {
                        languageVersion = JavaLanguageVersion.of(version)
                    }
                    candidate.get()
                    detektLauncher = candidate
                } catch (Exception e) {
                    failure = failure ?: e
                }
            }
            if (detektLauncher == null) {
                throw failure
            }
        }
        detektLauncher
    }
    if (runningJdk > detektNewestJdk) {
        javaLauncher.set(project.provider { chooseDetektLauncher() }.flatMap { it })
    }
    onlyIf {
        def skipped = reportDir.get().file('detekt-skipped.txt').asFile
        skipped.delete()
        if (runningJdk <= detektNewestJdk) {
            return true
        }
        try {
            chooseDetektLauncher()
            return true
        } catch (Exception e) {
            reportDir.get().asFile.mkdirs()
            skipped.text = ("detekt runs on JDK ${detektOldestJdk} to ${detektNewestJdk} only, " +
                "and Gradle runs on JDK ${runningJdk}. Gradle found no such JDK: install one where " +
                "Gradle looks for toolchains, or let Gradle download it (the " +
                "org.gradle.toolchains.foojay-resolver-convention plugin). ${e.message ?: ''}")
                .replaceAll(/\s+/, ' ').trim() + '\n'
            report.get().asFile.text = ''
            return false
        }
    }
    doFirst {
        reportDir.get().asFile.mkdirs()
        standardOutput = log
        errorOutput = log
        def mergedLists = nitpickerArgument('nitpicker.kotlin.detektLists')
        def typeResolutionClasspath = (configurations.nitpickerDetektStdlib.files + detekt.classpath()).unique()
            .collect { it.absolutePath }.join(File.pathSeparator)
        def styleLayers = tasks.named('nitpickerDetektLayers').get().ext.layersFile.readLines().findAll { it }
        args(['--input', kotlinLintedDirs().join(','),
              '--includes', '**/*.kt',
              '--report', "sarif:${report.get().asFile.absolutePath}".toString(),
              '--base-path', analysisRoot.absolutePath,
              '--build-upon-default-config',
              '--config', (styleLayers + [nitpickerConfig.absolutePath, mergedLists, validationOff.absolutePath]).findAll { it }.join(','),
              '--classpath', typeResolutionClasspath,
              '--jdk-home', detektJdkHome()])
    }
    doLast {
        def code = executionResult.get().exitValue
        if (!(code in [0, 2]) || !report.get().asFile.exists()) {
            throw new GradleException("detekt failed with exit code ${code}: ${log.toString('UTF-8').trim()}")
        }
    }
}
