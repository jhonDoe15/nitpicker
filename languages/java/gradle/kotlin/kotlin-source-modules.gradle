def shared = project.ext.nitpickerKotlinSourceModule
def analysisRoot = gradle.startParameter.currentDir
def relative = { File file -> analysisRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/') }

def kotlinSourceFiles = { kotlinSourceSet ->
    def generated = layout.buildDirectory.get().asFile.toPath()
    def dirs = kotlinSourceSet == null ? [] : kotlinSourceSet.kotlin.srcDirs.findAll {
        it.exists() && it.toPath().startsWith(projectDir.toPath()) && !it.toPath().startsWith(generated)
    }.sort()
    def present = dirs.collectMany { dir -> fileTree(dir) { include '**/*.kt' }.files }.unique().sort()
    def kept = new HashSet<File>()
    if (!dirs.isEmpty()) {
        kept.addAll(kotlinSourceSet.kotlin.files)
    }
    [dirs: dirs, files: present.findAll { kept.contains(it) }, excluded: present.findAll { !kept.contains(it) }]
}
def excludedFrom = { Collection found ->
    def kept = found.collectMany { it.files } as Set
    found.collectMany { it.excluded }.unique().findAll { !kept.contains(it) }.sort()
}
project.ext.nitpickerKotlinExcluded = { Collection kotlinSourceSets ->
    excludedFrom(kotlinSourceSets.collect { kotlinSourceFiles(it) })
}

def writeExcluded = { File list, Collection<File> excluded ->
    list.parentFile.mkdirs()
    list.setText(excluded.collect { relative(it) + '\n' }.unique().sort().join(''), 'UTF-8')
}
project.ext.nitpickerWriteKotlinExcluded = writeExcluded
def testSet = { String name -> name.startsWith('test') || name.contains('Test') }

afterEvaluate {
    if (!shared.selected(project)) {
        return
    }
    def moduleKey = shared.moduleKey(project)
    def reportDir = shared.reportBase
        ? objects.directoryProperty().fileValue(new File(shared.reportBase.toString(), moduleKey))
        : layout.buildDirectory.dir('nitpicker')
    shared.modules << [key: moduleKey, path: project.path, dir: relative(projectDir)]

    def sourcesOf = { boolean tests ->
        def found = project.kotlin.sourceSets.sort { it.name }.findAll { testSet(it.name) == tests }
            .collect { kotlinSourceFiles(it) }
        [dirs: found.collectMany { it.dirs }.unique(), files: found.collectMany { it.files }.unique()]
    }
    def excluded = { excludedFrom(project.kotlin.sourceSets.collect { kotlinSourceFiles(it) }) }

    configurations {
        nitpickerKotlinCompiler { canBeConsumed = false }
    }
    if (shared.repositories.allowed) {
        repositories { mavenCentral() }
    }
    dependencies {
        nitpickerKotlinCompiler "org.jetbrains.kotlin:kotlin-compiler-embeddable:${shared.pinned.kotlinCompiler}"
    }
    configurations.nitpickerKotlinCompiler.incoming.beforeResolve {
        configurations.nitpickerKotlinCompiler.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion(shared.pinned.kotlinCompiler)
            }
        }
    }

    def published = { project.extensions.findByName('publishing')?.publications?.isEmpty() == false }

    def lintedDirs = { (sourcesOf(false).dirs + sourcesOf(true).dirs).unique().sort() }
    def lintedFiles = { (sourcesOf(false).files + sourcesOf(true).files).unique().sort() }
    def kotlinJdkHome = { System.getProperty('java.home') }

    def jvmTargets = {
        def targets = project.kotlin.hasProperty('targets') ? project.kotlin.targets.toList() : []
        targets.findAll { it.platformType.name() == 'jvm' }
    }
    def jvmCompilations = {
        jvmTargets()
            .collectMany { target -> target.compilations.findAll { it.name in ['main', 'test'] }.toList() }
    }
    def jvmClasspath = {
        def compilations = jvmCompilations()
        def own = compilations.collectMany { it.output.classesDirs.files }.toSet()
        compilations.collectMany { it.compileDependencyFiles.files }.findAll {
            it.exists() && !it.name.startsWith('kotlin-stdlib') && !own.contains(it)
        }.unique()
    }

    project.ext.nitpickerKotlinTooling = shared.kotlinTooling(reportDir, lintedDirs, lintedFiles, kotlinJdkHome, [
        dependencies: jvmCompilations().collect { it.compileKotlinTaskName },
        enabled     : { !jvmCompilations().isEmpty() },
        classpath   : jvmClasspath,
    ])
    project.apply from: new File(shared.initScriptDir, 'kotlin/kotlin-format.gradle')
    project.apply from: new File(shared.initScriptDir, 'kotlin/kotlin-detekt.gradle')

    tasks.register('nitpickerKotlinPsi') {
        group = 'nitpicker'
        doLast {
            def directory = reportDir.get().asFile
            directory.mkdirs()
            def main = sourcesOf(false)
            def test = sourcesOf(true)
            def excludedList = new File(directory, 'kotlin-excluded.txt')
            writeExcluded(excludedList, excluded())
            def metrics = new File(directory, 'kotlin-metrics.json')
            def facts = new File(directory, 'kotlin-facts.json')
            if (main.files.isEmpty() && test.files.isEmpty()) {
                metrics.text = '{"functions":[],"files":[]}'
                facts.text = '{"files":[]}'
                new File(directory, 'kotlin-mutation-facts.json').text = '{"files":[]}'
                return
            }
            def compiler = configurations.nitpickerKotlinCompiler.asPath
            def classes = shared.psiClasses(project, compiler)
            def roots = main.dirs.collect { relative(it) } + test.dirs.collect { 'test:' + relative(it) }
            shared.runProcess('KotlinPsi', [new File(System.getProperty('java.home'), 'bin/java').absolutePath,
                    '-Djava.awt.headless=true', "-Dnitpicker.kotlinCompiler=${shared.pinned.kotlinCompiler}".toString(),
                    "-Dnitpicker.kotlinPsi.excluded=${excludedList.absolutePath}".toString(),
                    "-Dnitpicker.published=${published()}".toString(), '-cp',
                    compiler + File.pathSeparator + classes.absolutePath, 'nitpicker.kotlinpsi.KotlinPsi',
                    metrics.absolutePath, facts.absolutePath, analysisRoot.absolutePath] + roots,
                projectDir)
        }
    }

    def declaredNames = { configurations.collectMany { it.dependencies }.collect { "${it.group}:${it.name}".toString() } }
    def kotlinManifest = {
        def main = sourcesOf(false)
        def test = sourcesOf(true)
        def buildFacts = shared.buildFacts(project.rootProject)
        [
            kotlin               : true,
            published            : published(),
            kotlinSourceRoots    : main.dirs.collect { relative(it) },
            kotlinTestSourceRoots: test.dirs.collect { relative(it) },
            kotlinExcludedFiles  : excluded().collect { relative(it) },
            kotlinFormatter      : shared.formatter?.toString() ?: 'none',
            kotlinCallerGaps     : buildFacts.gaps,
            projectDependencies  : buildFacts.dependencies[project.path],
            kotlinSerialization  : plugins.hasPlugin('org.jetbrains.kotlin.plugin.serialization') || declaredNames().any {
                it ==~ /.*:(jackson-module-kotlin|kotlinx-serialization-(core|json)|moshi-kotlin).*/
            },
        ]
    }
    def writeMissing = { File directory, Map reports ->
        reports.each { name, text ->
            def report = new File(directory, name)
            if (!report.exists()) {
                report.text = text
            }
        }
    }
    def emptySarif = '{"version":"2.1.0","runs":[]}'
    def kotlinReports = ['detekt.sarif': emptySarif, 'ktlint.sarif': emptySarif, 'format.txt': '', 'ktfmt.txt': '']

    def jvmCompilation = { String name -> jvmCompilations().find { it.name == name } }
    def lintFiles = { String name ->
        def compilation = jvmCompilation(name)
        compilation == null ? [] : compilation.allKotlinSourceSets.collectMany { kotlinSourceFiles(it).files }.unique().sort()
    }
    def fragmentArguments = { String name ->
        def sets = jvmCompilation(name).allKotlinSourceSets.toList().sort { it.name }
        ['-Xmulti-platform', "-Xfragments=${sets*.name.join(',')}".toString()] +
            sets.collectMany { set -> kotlinSourceFiles(set).files.collect { "-Xfragment-sources=${set.name}:${relative(it)}".toString() } } +
            sets.collectMany { set -> set.dependsOn.collect { "-Xfragment-refines=${set.name}:${it.name}".toString() } }
    }
    def jvmLintSpecs = {
        if (jvmCompilations().isEmpty()) {
            return []
        }
        def mainTask = jvmCompilation('main').compileKotlinTaskName
        [[task: 'nitpickerKotlinLint', report: 'kotlinc.json', compileTask: mainTask, dependencies: [mainTask],
          present: { lintFiles('main') }, files: { lintFiles('main') },
          extraArguments: { fragmentArguments('main') },
          libraries: { jvmCompilation('main').compileDependencyFiles.files }],
         [task: 'nitpickerKotlinTestLint', report: 'kotlinc-test.json', compileTask: jvmCompilation('test').compileKotlinTaskName,
          dependencies: [mainTask],
          present: { lintFiles('test') }, files: { lintFiles('test') },
          extraArguments: {
              def friends = jvmCompilation('main').output.classesDirs.files.findAll { it.exists() }
              fragmentArguments('test') +
                  (friends.isEmpty() ? [] : ["-Xfriend-paths=${friends.collect { it.absolutePath }.join(',')}".toString()])
          },
          libraries: { jvmCompilation('test').compileDependencyFiles.files }]]
    }
    def applyTests = {
        if (jvmCompilations().isEmpty() || shared.quick) {
            return
        }
        def modulePath = relative(projectDir) ?: '.'
        project.ext.nitpickerKotlinJvmTarget = [
            reportDir: reportDir, pinned: shared.pinned, testsFailed: shared.testsFailed.contains(modulePath),
            target: jvmTargets()[0],
            mainClasses: jvmCompilation('main').output.classesDirs,
            sourceRoots: jvmCompilation('main').allKotlinSourceSets.collectMany { it.kotlin.srcDirs }.findAll { it.exists() },
        ]
        project.apply from: new File(shared.initScriptDir, 'kotlin/kotlin-multiplatform-tests.gradle')
    }
    def applyLint = {
        if (!project.ext.has('nitpickerReportDir')) {
            project.ext.nitpickerReportDir = reportDir
        }
        project.ext.nitpickerKotlinJdkHome = kotlinJdkHome
        project.ext.nitpickerKotlinLintSpecs = jvmLintSpecs()
        project.apply from: new File(shared.initScriptDir, 'kotlin/kotlin-lint.gradle')
    }

    tasks.register('nitpickerJava') {
        group = 'nitpicker'
        dependsOn 'nitpickerKotlinPsi', 'nitpickerKtlint', 'nitpickerKtfmt', 'nitpickerDetekt'
        doLast {
            def directory = reportDir.get().asFile
            def empty = ['structure.json': '[]', 'classes.json': '{"files":{},"classes":[]}', 'errorprone.json': '[]',
                         'pmd.sarif': emptySarif, 'spotbugs.sarif': emptySarif, 'jdeps.txt': '', 'jdeps-test.txt': '',
                         'jdeps-classes.txt': ''] + kotlinReports
            writeMissing(directory, empty)
            def jvm = !jvmCompilations().isEmpty()
            def ran = jvm ? 'the source checks, the format check, detekt, the kotlinc lint' +
                (shared.quick ? '' : ', the tests of the JVM target, coverage and CRAP') : 'the source checks and the format check'
            def targets = jvmTargets()
            def firstOnly = targets.size() > 1
                ? ["; only the first JVM target (${targets[0].name}) gets the kotlinc lint, tests, coverage and CRAP"] : []
            def missing = (jvm ? [] : ['detekt', 'the kotlinc lint', 'the tests', 'coverage']) +
                (jvm && shared.quick ? ['the tests and coverage'] : []) + ['mutation testing', 'the .java files']
            new File(directory, 'kotlin-notes.json').setText(groovy.json.JsonOutput.toJson([
                "The Android or Multiplatform project ${project.path} gets ${ran}; " +
                    "${missing.join(', ')} do not run on it${firstOnly ? firstOnly[0] : ''}.".toString()]), 'UTF-8')
            new File(directory, 'manifest.json').text = groovy.json.JsonOutput.toJson([
                versions             : shared.pinned,
                moduleKey            : moduleKey,
                sourceRoots          : [],
                testSourceRoots      : [],
                resourceRoots        : [],
                kotlinSourceModule   : true,
                spring               : false,
                springArch           : false,
                testsFailed          : shared.testsFailed.contains(relative(projectDir) ?: '.'),
                unrunTestSourceSets  : [],
            ] + kotlinManifest())
        }
    }
    applyLint()
    applyTests()
}
