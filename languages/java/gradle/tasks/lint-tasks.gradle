def pinned = project.ext.nitpickerPinned
def reportDir = project.ext.nitpickerReportDir
def toolCommand = project.ext.nitpickerToolCommand
def rulesDir = new File(buildscript.sourceFile.parentFile, '../rules')
def javaHome = new File(System.getProperty('java.home'))

configurations {
    nitpickerForbiddenApis { canBeConsumed = false }
}
dependencies {
    nitpickerForbiddenApis "de.thetaphi:forbiddenapis:${pinned.forbiddenapis}"
}

def analyzedClassDirs = project.ext.nitpickerAnalyzedClassDirs
tasks.register('nitpickerForbiddenApis', JavaExec) {
    group = 'nitpicker'
    dependsOn tasks.named('classes')
    classpath = configurations.nitpickerForbiddenApis
    mainClass = 'de.thetaphi.forbiddenapis.cli.CliMain'
    ignoreExitValue = true
    def report = reportDir.map { it.file('forbidden-apis.txt') }
    inputs.files({ analyzedClassDirs() }, sourceSets.main.compileClasspath, new File(rulesDir, 'forbidden-apis.txt'))
        .withPropertyName('classes')
    outputs.file(report).withPropertyName('report')
    def log = new ByteArrayOutputStream()
    def command = null
    onlyIf { analyzedClassDirs().any { it.exists() && it.list()?.length } }
    doFirst {
        reportDir.get().asFile.mkdirs()
        standardOutput = log
        errorOutput = log
        def classDirs = analyzedClassDirs().findAll { it.exists() }
        def libraries = sourceSets.main.compileClasspath.files.findAll { it.exists() }
        command = toolCommand('forbiddenapis', [
            classDirectories: classDirs*.absolutePath,
            libraries       : libraries*.absolutePath,
            signatures      : new File(rulesDir, 'forbidden-apis.txt').absolutePath,
        ])
        args(command.args)
    }
    doLast {
        def code = executionResult.get().exitValue
        report.get().asFile.text = log.toString('UTF-8')
        if (!command.accepts(code)) {
            throw new GradleException("forbiddenapis failed with exit code ${code}: ${log.toString('UTF-8').trim()}")
        }
    }
}

def analysisRoot = project.ext.nitpickerAnalysisRoot
def compilerOf = project.ext.nitpickerCompilerOf
def pathsOf = { Collection<File> files -> files.collect { it.absolutePath } }
def runNode = project.ext.nitpickerRunNode
def guardsRunner = new File(buildscript.sourceFile.parentFile, '../../adapters/gradle-reports/gradle-guards.mjs')
    .canonicalFile
def lintBaseline = gradle.startParameter.projectProperties['nitpicker.lintBaseline']

tasks.register('nitpickerLint') {
    group = 'nitpicker'
    description = 'Runs the javac lint and reads the sealed permits from guards-plan.json.'
    dependsOn tasks.named('classes')
    doLast {
        def compile = tasks.named('compileJava').get()
        def javac = compile.javaCompiler.orNull?.executablePath?.asFile ?: new File(javaHome, 'bin/javac')
        def lintDirectory = layout.buildDirectory.dir('nitpicker-lint').get().asFile
        def generated = compile.options.generatedSourceOutputDirectory.asFile.orNull
        reportDir.get().asFile.mkdirs()
        reportDir.get().file('guards-plan.json').asFile.text = groovy.json.JsonOutput.toJson([
            classDirectories: pathsOf(sourceSets.main.output.classesDirs.files.findAll { it.exists() }),
            lint            : [
                root            : analysisRoot.absolutePath,
                basedir         : projectDir.absolutePath,
                reportRoot      : analysisRoot.absolutePath,
                sources         : pathsOf(sourceSets.main.allJava.files),
                generatedSources: generated == null ? [] : [generated.absolutePath],
                classDirectory  : compile.destinationDirectory.get().asFile.absolutePath,
                classpath       : pathsOf(compile.classpath.files),
                processorPath   : pathsOf(compile.options.annotationProcessorPath?.files ?: []),
                javac           : javac.absolutePath,
                compiler        : compilerOf(compile),
                workDirectory   : new File(lintDirectory, 'work').absolutePath,
                cacheDirectory  : lintDirectory.absolutePath,
            ],
        ])
        runNode(guardsRunner, [reportDir.get().asFile.absolutePath] + (lintBaseline ? [lintBaseline.toString()] : []),
            'nitpicker could not run the javac lint')
    }
}

tasks.named('nitpickerJava') { dependsOn 'nitpickerForbiddenApis', 'nitpickerLint' }
