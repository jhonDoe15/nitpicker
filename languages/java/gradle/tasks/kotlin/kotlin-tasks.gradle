def pinned = project.ext.nitpickerPinned
def reportDir = project.ext.nitpickerReportDir
def relativeToRoot = project.ext.nitpickerRelativeToRoot
def analysisRoot = project.ext.nitpickerAnalysisRoot
def analyzedClassDirs = project.ext.nitpickerAnalyzedClassDirs
def nitpickerArgument = { String name -> gradle.startParameter.projectProperties[name] }
def gradleDirectory = new File(buildscript.sourceFile.parentFile, '../..').canonicalFile
def kotlinToolMinimum = 17
def detektNewestJdk = 21

plugins.withId('org.jetbrains.kotlin.jvm') {
    def relative = relativeToRoot
    def kotlinSourceDirsOf = { String sourceSet ->
        def generated = layout.buildDirectory.get().asFile.toPath()
        def kotlinSourceSet = project.kotlin.sourceSets.findByName(sourceSet)
        (kotlinSourceSet == null ? [] : kotlinSourceSet.kotlin.srcDirs).findAll {
            it.exists() && it.toPath().startsWith(projectDir.toPath()) && !it.toPath().startsWith(generated)
        }.sort()
    }
    def kotlinSourceDirs = { kotlinSourceDirsOf('main') }
    def kotlinFiles = {
        kotlinSourceDirs().collectMany { dir -> fileTree(dir) { include '**/*.kt' }.files.sort() }.unique()
    }
    def hasJavaSources = { !(sourceSets.main.java.files + sourceSets.test.java.files).isEmpty() }
    def hasJavaClasses = { analyzedClassDirs().any { it.exists() && it.list()?.length } }
    def kotlinFormatter = { nitpickerArgument('nitpicker.kotlin.formatter')?.toString() ?: 'none' }
    def writeFormatList = { List<String> files ->
        reportDir.get().asFile.mkdirs()
        reportDir.get().file('ktfmt.txt').asFile.text = files.unique().sort().collect { it + '\n' }.join('')
    }
    def kotlinToolJava = { String tool, int maximum = Integer.MAX_VALUE ->
        project.ext.nitpickerToolJava(tool, kotlinToolMinimum, [], maximum)
    }
    def runsOnToolJava = { JavaExec task, String tool, String skipName, int maximum = Integer.MAX_VALUE ->
        def chosen = null
        def choose = { ->
            chosen = chosen ?: kotlinToolJava(tool, maximum)
            chosen
        }
        task.javaLauncher.set(project.provider { choose().launcher }.flatMap { it })
        task.onlyIf {
            reportDir.get().asFile.mkdirs()
            def skipped = reportDir.get().file(skipName).asFile
            skipped.delete()
            if (choose().skipped) {
                skipped.text = "${choose().skipped}\n"
            }
            !choose().skipped
        }
    }

    configurations {
        nitpickerDetekt { canBeConsumed = false }
        nitpickerDetektStdlib { canBeConsumed = false }
        nitpickerKtlint { canBeConsumed = false }
        nitpickerKtfmt { canBeConsumed = false }
        nitpickerKotlinCompiler { canBeConsumed = false }
    }
    dependencies {
        nitpickerKotlinCompiler "org.jetbrains.kotlin:kotlin-compiler-embeddable:${pinned.kotlinCompiler}"
        nitpickerDetekt("io.gitlab.arturbosch.detekt:detekt-cli:${pinned.detekt}:all") {
            transitive = false
        }
        nitpickerDetektStdlib("org.jetbrains.kotlin:kotlin-stdlib:${pinned.detektKotlin}") {
            transitive = false
        }
        nitpickerKtlint("com.pinterest.ktlint:ktlint-cli:${pinned.ktlint}:all") { transitive = false }
        nitpickerKtfmt("com.facebook:ktfmt:${pinned.ktfmt}:with-dependencies") { transitive = false }
    }

    configurations.nitpickerKotlinCompiler.incoming.beforeResolve {
        configurations.nitpickerKotlinCompiler.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion(pinned.kotlinCompiler)
            }
        }
    }

    tasks.named('nitpickerPmd') { onlyIf { hasJavaSources() } }
    tasks.named('nitpickerFormat') { onlyIf { hasJavaSources() } }
    tasks.named('nitpickerSpotbugs') { onlyIf { hasJavaSources() && hasJavaClasses() } }

    tasks.register('nitpickerDetekt', JavaExec) {
        group = 'nitpicker'
        classpath = configurations.nitpickerDetekt
        mainClass = 'io.gitlab.arturbosch.detekt.cli.Main'
        ignoreExitValue = true
        def report = reportDir.map { it.file('detekt.sarif') }
        def log = new ByteArrayOutputStream()
        def nitpickerConfig = new File(gradleDirectory, '../detekt/nitpicker-detekt.yml').canonicalFile
        def validationOff = new File(gradleDirectory, '../detekt/detekt-validation.yml').canonicalFile
        dependsOn 'compileJava'
        onlyIf { !kotlinSourceDirs().isEmpty() }
        runsOnToolJava(it, 'detekt', 'detekt-skipped.txt', detektNewestJdk)
        doFirst {
            reportDir.get().asFile.mkdirs()
            standardOutput = log
            errorOutput = log
            def projectConfig = nitpickerArgument('nitpicker.kotlin.detektConfig')
            def libraries = sourceSets.main.compileClasspath.files.findAll {
                it.exists() && !it.name.startsWith('kotlin-stdlib')
            }
            def typeResolutionClasspath = (configurations.nitpickerDetektStdlib.files +
                analyzedClassDirs().findAll { it.exists() } + libraries)
                .collect { it.absolutePath }.join(File.pathSeparator)
            args(['--input', kotlinSourceDirs().join(','),
                  '--includes', '**/*.kt',
                  '--report', "sarif:${report.get().asFile.absolutePath}".toString(),
                  '--base-path', analysisRoot.absolutePath,
                  '--build-upon-default-config',
                  '--config', [projectConfig, nitpickerConfig.absolutePath, validationOff.absolutePath]
                      .findAll { it }.join(','),
                  '--classpath', typeResolutionClasspath,
                  '--jdk-home', project.ext.nitpickerProjectJavaHome()])
        }
        doLast {
            def code = executionResult.get().exitValue
            if (!(code in [0, 2]) || !report.get().asFile.exists()) {
                def output = log.toString('UTF-8').trim()
                throw new GradleException("detekt failed with exit code ${code}: ${output}")
            }
        }
    }

    tasks.register('nitpickerKtlint', JavaExec) {
        group = 'nitpicker'
        classpath = configurations.nitpickerKtlint
        mainClass = 'com.pinterest.ktlint.Main'
        ignoreExitValue = true
        def log = new ByteArrayOutputStream()
        def report = reportDir.map { it.file('ktlint.sarif') }
        workingDir = analysisRoot
        onlyIf { kotlinFormatter() == 'ktlint' && !kotlinFiles().isEmpty() }
        runsOnToolJava(it, 'ktlint', 'ktlint-skipped.txt')
        doFirst {
            reportDir.get().asFile.mkdirs()
            standardOutput = log
            errorOutput = log
            report.get().asFile.delete()
            args(['--relative', "--reporter=sarif,output=${report.get().asFile.absolutePath}".toString()] +
                kotlinSourceDirs().collect { "${relative(it)}/**/*.kt".toString() })
        }
        doLast {
            if (executionResult.get().exitValue > 1 || !report.get().asFile.exists()) {
                throw new GradleException("ktlint failed: ${log.toString('UTF-8').trim()}")
            }
        }
    }

    tasks.register('nitpickerKtfmt', JavaExec) {
        group = 'nitpicker'
        classpath = configurations.nitpickerKtfmt
        mainClass = 'com.facebook.ktfmt.cli.Main'
        ignoreExitValue = true
        def changed = new ByteArrayOutputStream()
        def errors = new ByteArrayOutputStream()
        workingDir = analysisRoot
        onlyIf { kotlinFormatter() == 'ktfmt' && !kotlinFiles().isEmpty() }
        runsOnToolJava(it, 'ktfmt', 'ktfmt-skipped.txt')
        doFirst {
            standardOutput = changed
            errorOutput = errors
            def style = "--${nitpickerArgument('nitpicker.kotlin.ktfmtStyle') ?: 'meta'}-style".toString()
            def argumentFile = new File(temporaryDir, 'ktfmt.args')
            argumentFile.text = ([style, '--dry-run'] +
                (nitpickerArgument('nitpicker.kotlin.editorconfig') == 'true'
                    ? ['--enable-editorconfig'] : []) +
                kotlinFiles().collect { relative(it) }).collect { it + '\n' }.join('')
            args("@${argumentFile.absolutePath}".toString())
        }
        doLast {
            def problems = errors.toString('UTF-8').trim()
            if (executionResult.get().exitValue != 0 || problems.contains('Error formatting')) {
                throw new GradleException("ktfmt failed: ${problems}")
            }
            writeFormatList(changed.toString('UTF-8').readLines().collect { it.trim() }
                .findAll { it.endsWith('.kt') })
        }
    }

    tasks.register('nitpickerKotlinMetrics') {
        group = 'nitpicker'
        dependsOn tasks.named('classes')
        def metricsSource = new File(gradleDirectory, 'KotlinMetrics.java')
        doLast {
            reportDir.get().asFile.mkdirs()
            def output = reportDir.get().file('kotlin-metrics.json').asFile
            def roots = kotlinSourceDirs().collect { relative(it) }
            def skipped = reportDir.get().file('kotlin-metrics-skipped.txt').asFile
            skipped.delete()
            def chosen = kotlinFiles().isEmpty() ? null : kotlinToolJava('KotlinMetrics')
            if (chosen?.skipped) {
                skipped.text = "${chosen.skipped}\n"
            }
            if (chosen == null || chosen.skipped) {
                output.text = '{"functions":[],"files":[]}'
                return
            }
            def process = new ProcessBuilder([chosen.java, '-Djava.awt.headless=true',
                    "-Dnitpicker.kotlinCompiler=${pinned.kotlinCompiler}".toString(), '-cp',
                    configurations.nitpickerKotlinCompiler.asPath, metricsSource.absolutePath,
                    output.absolutePath, analysisRoot.absolutePath] + roots)
                .directory(projectDir).redirectErrorStream(true).start()
            def log = process.inputStream.getText('UTF-8')
            if (process.waitFor() != 0) {
                throw new GradleException("KotlinMetrics failed: ${log.trim()}")
            }
        }
    }

    tasks.named('nitpickerJava') {
        dependsOn 'nitpickerDetekt', 'nitpickerKtlint', 'nitpickerKtfmt', 'nitpickerKotlinMetrics'
        doLast {
            def directory = reportDir.get().asFile
            def emptySarif = '{"version":"2.1.0","runs":[]}'
            [
                'pmd.sarif'        : emptySarif,
                'spotbugs.sarif'   : emptySarif,
                'detekt.sarif'     : emptySarif,
                'ktlint.sarif'     : emptySarif,
                'format.txt'       : '',
                'ktfmt.txt'        : '',
                'checkstyle.xml'   :
                    "<checkstyle version=\"${pinned.checkstyle}\"></checkstyle>".toString(),
            ].each { name, text ->
                def report = new File(directory, name)
                if (!report.exists()) {
                    report.text = text
                }
            }
            def manifestFile = new File(directory, 'manifest.json')
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            manifest.sourceRoots = sourceSets.main.java.srcDirs.collect { relative(it) }
            manifest.kotlin = true
            manifest.kotlinSourceRoots = kotlinSourceDirs().collect { relative(it) }
            manifest.kotlinTestSourceRoots = kotlinSourceDirsOf('test').collect { relative(it) }
            manifest.kotlinFormatter = kotlinFormatter()
            manifestFile.text = groovy.json.JsonOutput.toJson(manifest)
        }
    }
}
