def reportDir = project.ext.nitpickerReportDir
def toolCommand = project.ext.nitpickerToolCommand
def generatedSourceSet = project.ext.nitpickerGeneratedSourceSet

tasks.register('nitpickerCpd') {
    group = 'nitpicker'
    def report = reportDir.map { it.file('cpd.xml') }
    def failure = reportDir.map { it.file('cpd-failed.txt') }
    def skipped = reportDir.map { it.file('cpd-skipped.txt') }
    def writtenSourceSets = { sourceSets.findAll { !generatedSourceSet(it) } }
    def sourceDirectories = {
        def declared = writtenSourceSets().collectMany { it.allJava.sourceDirectories.files }.unique()
        project.ext.nitpickerHandWrittenDirs(declared).findAll { it.exists() }
    }
    inputs.files({ writtenSourceSets()*.allJava }).withPropertyName('sources')
    inputs.files(configurations.nitpickerPmd).withPropertyName('pmd')
    inputs.file(project.ext.nitpickerToolLauncher('cpd')).withPropertyName('launcher')
    inputs.files(project.ext.nitpickerToolCommandInputs).withPropertyName('toolCommands')
    outputs.file(report).withPropertyName('report')
    onlyIf {
        if (sourceDirectories().any { !project.fileTree(it) { include '**/*.java' }.isEmpty() }) {
            return true
        }
        report.get().asFile.delete()
        failure.get().asFile.delete()
        skipped.get().asFile.delete()
        false
    }
    doLast {
        reportDir.get().asFile.mkdirs()
        report.get().asFile.delete()
        failure.get().asFile.delete()
        skipped.get().asFile.delete()
        def directories = sourceDirectories()
        if (directories.isEmpty()) {
            return
        }
        def enginePlan = new File(temporaryDir, 'cpd-engine-plan.json')
        enginePlan.text = groovy.json.JsonOutput.toJson([
            report     : report.get().asFile.absolutePath,
            directories: directories*.absolutePath,
        ])
        project.ext.nitpickerWriteRules('cpd-engine', enginePlan)
        if (report.get().asFile.exists()) {
            return
        }
        def java = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        def command = toolCommand('cpd', [
            report     : report.get().asFile.absolutePath,
            directories: directories*.absolutePath,
        ], temporaryDir)
        def result = project.ext.nitpickerRunHelper('cpd-report', command.launcher, java,
            command.args.collect { it.toString() }, configurations.nitpickerPmd.files.toList())
        if (!command.accepts(result.status)) {
            failure.get().asFile.text = "${result.status}\n${result.stderr}"
            report.get().asFile.delete()
        }
    }
}

tasks.named('nitpickerJava') { dependsOn 'nitpickerCpd' }
