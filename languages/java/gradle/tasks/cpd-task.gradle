def reportDir = project.ext.nitpickerReportDir
def cpdSource = new File(buildscript.sourceFile.parentFile, '../CpdReport.java').canonicalFile

tasks.register('nitpickerCpd') {
    group = 'nitpicker'
    def report = reportDir.map { it.file('cpd.xml') }
    def failure = reportDir.map { it.file('cpd-failed.txt') }
    def skipped = reportDir.map { it.file('cpd-skipped.txt') }
    def sourceDirectories = {
        sourceSets.collectMany { it.allJava.sourceDirectories.files }.unique().findAll { it.exists() }
    }
    inputs.files({ sourceSets*.allJava }).withPropertyName('sources')
    inputs.files(configurations.nitpickerPmd).withPropertyName('pmd')
    inputs.file(cpdSource).withPropertyName('launcher')
    outputs.file(report).withPropertyName('report')
    doLast {
        reportDir.get().asFile.mkdirs()
        report.get().asFile.delete()
        failure.get().asFile.delete()
        skipped.get().asFile.delete()
        def directories = sourceDirectories()
        if (directories.isEmpty()) {
            return
        }
        def java = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        def launch = [java, '-cp', configurations.nitpickerPmd.asPath, cpdSource.absolutePath,
            report.get().asFile.absolutePath]
        def process = new ProcessBuilder(launch + directories.collect { it.absolutePath })
            .directory(projectDir).redirectOutput(ProcessBuilder.Redirect.DISCARD).start()
        def errors = process.errorStream.getText('UTF-8')
        def code = process.waitFor()
        def written = report.get().asFile.isFile() ? report.get().asFile.text : ''
        if (!(code in [0, 4]) || !(written =~ /<pmd-cpd[\s\/>]/)) {
            failure.get().asFile.text = "${code}\n${errors}"
            report.get().asFile.delete()
        }
    }
}

tasks.named('nitpickerJava') { dependsOn 'nitpickerCpd' }
