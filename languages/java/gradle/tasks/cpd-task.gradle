def reportDir = project.ext.nitpickerReportDir

tasks.register('nitpickerCpd', JavaExec) {
    group = 'nitpicker'
    classpath = configurations.nitpickerPmd
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'
    ignoreExitValue = true
    def report = reportDir.map { it.file('cpd.xml') }
    def failure = reportDir.map { it.file('cpd-failed.txt') }
    def errors = new ByteArrayOutputStream()
    def sourceDirectories = {
        sourceSets.collectMany { it.allJava.sourceDirectories.files }.unique().findAll { it.exists() }
    }
    onlyIf { !sourceDirectories().isEmpty() }
    inputs.files({ sourceSets*.allJava }).withPropertyName('sources')
    outputs.file(report).withPropertyName('report')
    doFirst {
        reportDir.get().asFile.mkdirs()
        failure.get().asFile.delete()
        standardOutput = new FileOutputStream(report.get().asFile)
        errorOutput = errors
        args(['cpd', '--minimum-tokens', '100', '--ignore-identifiers', '--ignore-literals', '--language', 'java',
              '--format', 'xml', '--no-fail-on-error'] +
            sourceDirectories().collectMany { ['--dir', it.absolutePath] })
    }
    doLast {
        def code = executionResult.get().exitValue
        def output = report.get().asFile
        if (!(code in [0, 4]) || !(output.text =~ /<pmd-cpd[\s\/>]/)) {
            failure.get().asFile.text = "${code}\n${errors.toString('UTF-8')}"
            output.delete()
        }
    }
}

tasks.named('nitpickerJava') { dependsOn 'nitpickerCpd' }
