def reportDir = layout.buildDirectory.dir('nitpicker')
def constantSizes = [3: 4, 4: 4, 5: 8, 6: 8, 7: 2, 8: 2, 9: 4, 10: 4, 11: 4, 12: 4, 15: 3, 16: 2, 17: 4, 18: 4, 19: 2, 20: 2]

def skipMembers = { java.io.DataInputStream input ->
    def count = input.readUnsignedShort()
    count.times {
        input.skipBytes(6)
        input.readUnsignedShort().times {
            input.skipBytes(2)
            input.skipBytes(input.readInt())
        }
    }
}

def permittedSubclasses = { File classFile ->
    new java.io.DataInputStream(new BufferedInputStream(new FileInputStream(classFile))).withCloseable { input ->
        input.skipBytes(8)
        def count = input.readUnsignedShort()
        def utf = [:]
        def classes = [:]
        def index = 1
        while (index < count) {
            def tag = input.readUnsignedByte()
            if (tag == 1) {
                utf[index] = input.readUTF()
            } else if (tag == 7) {
                classes[index] = input.readUnsignedShort()
            } else {
                input.skipBytes(constantSizes[tag])
            }
            index += (tag == 5 || tag == 6) ? 2 : 1
        }
        input.skipBytes(2)
        def self = utf[classes[input.readUnsignedShort()]]
        input.skipBytes(2)
        input.skipBytes(2 * input.readUnsignedShort())
        skipMembers(input)
        skipMembers(input)
        def permitted = []
        input.readUnsignedShort().times {
            def name = utf[input.readUnsignedShort()]
            def length = input.readInt()
            if (name == 'PermittedSubclasses') {
                input.readUnsignedShort().times { permitted << utf[classes[input.readUnsignedShort()]] }
            } else {
                input.skipBytes(length)
            }
        }
        permitted.collect { "${self.replace('/', '.')} -> ${it.replace('/', '.')}".toString() }
    }
}

tasks.register('nitpickerPermits') {
    group = 'nitpicker'
    dependsOn tasks.named('classes')
    doLast {
        reportDir.get().asFile.mkdirs()
        def lines = sourceSets.main.output.classesDirs.files.findAll { it.exists() }.collectMany { directory ->
            fileTree(directory) { include '**/*.class' }.files.sort().collectMany { permittedSubclasses(it) }
        }
        reportDir.get().file('permits.txt').asFile.text = lines.collect { it + '\n' }.join('')
    }
}

tasks.named('nitpickerJava') { dependsOn 'nitpickerPermits' }
