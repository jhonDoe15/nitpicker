def reportDir = project.ext.nitpickerReportDir
def declaredConfigurations = ['implementation', 'api']

tasks.register('nitpickerDependencies') {
    group = 'nitpicker'
    dependsOn tasks.named('classes')
    inputs.files(sourceSets.main.output.classesDirs, configurations.compileClasspath).withPropertyName('classes')
    inputs.property('declared', providers.provider { declaredConfigurations.collectMany { name ->
        configurations.findByName(name)?.dependencies?.collect {
            "${name} ${it.group}:${it.name}:${it.version}".toString()
        } ?: []
    } })
    outputs.file(reportDir.map { it.file('dependencies.json') }).withPropertyName('report')
    doLast {
        reportDir.get().asFile.mkdirs()
        def archivesOf = [:]
        def redirects = [:]
        def redirectsKnown = true
        try {
            configurations.compileClasspath.incoming.resolutionResult.root.dependencies.each { dependency ->
                if (dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
                    def module = dependency.selected.moduleVersion
                    dependency.selected.variants.each { variant ->
                        variant.externalVariant.ifPresent { external ->
                            def owner = external.owner
                            if (owner instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                                redirects.computeIfAbsent("${module.group}:${module.name}".toString()) { [] as Set } <<
                                    "${owner.group}:${owner.module}".toString()
                            }
                        }
                    }
                }
            }
        } catch (Exception | LinkageError ignored) {
            redirects.clear()
            redirectsKnown = false
        }
        def lenient = configurations.compileClasspath.resolvedConfiguration.lenientConfiguration
        lenient.firstLevelModuleDependencies.each { resolved ->
            def own = resolved.moduleArtifacts
            def id = "${resolved.moduleGroup}:${resolved.moduleName}".toString()
            def variants = own.isEmpty() ? resolved.children.findAll {
                redirectsKnown
                    ? redirects.getOrDefault(id, []).contains("${it.moduleGroup}:${it.moduleName}".toString())
                    : it.moduleGroup == resolved.moduleGroup && it.moduleName.startsWith(resolved.moduleName + '-')
            }.collectMany { it.moduleArtifacts } : []
            archivesOf["${resolved.moduleGroup}:${resolved.moduleName}".toString()] =
                (own + variants).collect { it.file }.findAll { it.exists() }.unique()
        }
        def classDirs = sourceSets.main.output.classesDirs.files.findAll { it.exists() && it.list()?.length }
        def declared = declaredConfigurations.findAll { configurations.findByName(it) != null }.collectMany { name ->
            configurations.getByName(name).dependencies.withType(ExternalModuleDependency).collect { dependency ->
                def archives = archivesOf["${dependency.group}:${dependency.name}".toString()] ?: []
                [configuration: name, group: dependency.group ?: '', name: dependency.name,
                 archives: archives.collect { it.name }, archivePaths: archives.collect { it.absolutePath }]
            }
        }
        def buildFile = project.buildFile.exists() ? project.ext.nitpickerRelativeToRoot(project.buildFile) : null
        reportDir.get().file('dependencies.json').asFile.text = groovy.json.JsonOutput.toJson([
            buildFile: buildFile,
            analyzed : !classDirs.isEmpty(),
            classDirectories: classDirs.collect { it.absolutePath },
            declared : declared,
        ])
    }
}

tasks.named('nitpickerJava') { dependsOn 'nitpickerDependencies' }
