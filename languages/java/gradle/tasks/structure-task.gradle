def reportDir = project.ext.nitpickerReportDir
def relativeToRoot = project.ext.nitpickerRelativeToRoot
def analysisRoot = project.ext.nitpickerAnalysisRoot
def metricsSource = new File(buildscript.sourceFile.parentFile, '../StructureMetrics.java')

tasks.register('nitpickerStructure') {
    group = 'nitpicker'
    doLast {
        reportDir.get().asFile.mkdirs()
        def roots = sourceSets.main.allJava.sourceDirectories.files.findAll { it.exists() }
            .collect { relativeToRoot(it) }
        def output = reportDir.get().file('structure.json').asFile
        def skipped = reportDir.get().file('structure-skipped.txt').asFile
        skipped.delete()
        def chosen = project.ext.nitpickerToolJava('StructureMetrics', 21, project.ext.nitpickerJavaCompiles())
        if (chosen.skipped) {
            output.text = '[]\n'
            skipped.text = "${chosen.skipped}\n"
            return
        }
        def process = new ProcessBuilder([chosen.java, metricsSource.canonicalPath,
                output.absolutePath, analysisRoot.absolutePath] + roots)
            .directory(projectDir).redirectErrorStream(true).start()
        def log = process.inputStream.getText('UTF-8')
        if (process.waitFor() != 0) {
            throw new GradleException("StructureMetrics failed: ${log.trim()}")
        }
    }
}
