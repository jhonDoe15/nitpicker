def reportDir = project.ext.nitpickerReportDir
def analyzedClassDirs = project.ext.nitpickerAnalyzedClassDirs
def kotlinPreset = project.ext.nitpickerKotlinPreset
def mainSources = sourceSets.main.allJava.sourceDirectories

tasks.register('nitpickerSpotbugs', JavaExec) {
    group = 'nitpicker'
    dependsOn tasks.named('classes')
    classpath = configurations.nitpickerSpotbugs
    mainClass = 'edu.umd.cs.findbugs.FindBugs2'
    ignoreExitValue = true
    doFirst {
        reportDir.get().asFile.mkdirs()
        def sourcePath = mainSources.files.findAll { it.exists() }.join(File.pathSeparator)
        def classDirs = analyzedClassDirs().findAll { it.exists() }
        def auxiliary = kotlinPreset
            ? sourceSets.main.runtimeClasspath.files.findAll { it.exists() && !classDirs.contains(it) } : []
        args(['-effort:default', '-medium', '-sarif',
              '-output', reportDir.get().file('spotbugs.sarif').asFile.absolutePath,
              '-sourcepath', sourcePath] +
            (auxiliary.isEmpty() ? [] : ['-auxclasspath', auxiliary.join(File.pathSeparator)]) +
            classDirs.collect { it.absolutePath })
    }
}
