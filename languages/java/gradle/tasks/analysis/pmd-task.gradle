def reportDir = project.ext.nitpickerReportDir
def toolCommand = project.ext.nitpickerToolCommand
def writeRules = project.ext.nitpickerWriteRules
def compilerOf = project.ext.nitpickerCompilerOf
def testSourceDirectories = project.ext.nitpickerTestSourceDirectories
def usesSpring = project.ext.nitpickerUsesSpring
def nitpickerArgument = { String name -> gradle.startParameter.projectProperties[name] }
def mainSources = sourceSets.main.allJava.sourceDirectories
def lintedSources = { (mainSources.files + testSourceDirectories()).findAll { it.exists() } }
def allClassesTasks = { sourceSets.collect { tasks.named(it.classesTaskName) } }

tasks.register('nitpickerPmd', JavaExec) {
    group = 'nitpicker'
    dependsOn allClassesTasks
    classpath = configurations.nitpickerPmd
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'
    ignoreExitValue = true
    def command = null
    inputs.files(project.ext.nitpickerToolCommandInputs).withPropertyName('toolCommands')
    def nitpickerRulesets = nitpickerArgument('nitpicker.pmd.nitpickerConfig') != 'false'
    def projectRuleset = nitpickerArgument('nitpicker.pmd.projectConfig')
    doFirst {
        reportDir.get().asFile.mkdirs()
        def auxClasspath = reportDir.get().file('pmd-aux-classpath.txt').asFile
        auxClasspath.text = (sourceSets.collectMany { it.compileClasspath.files + it.output.classesDirs.files })
            .findAll { it.exists() }.unique().collect { it.absolutePath }.join('\n')
        def plan = reportDir.get().file('pmd-plan.json').asFile
        plan.text = groovy.json.JsonOutput.toJson([
            reportDir      : reportDir.get().asFile.absolutePath,
            mainDirectories: mainSources.files.collect { it.absolutePath },
            testDirectories: testSourceDirectories().collect { it.absolutePath },
            compiler       : compilerOf(tasks.named('compileJava').get()),
            spring         : usesSpring(),
            nitpicker      : nitpickerRulesets,
            project        : projectRuleset,
        ])
        writeRules('pmd', plan)
        command = toolCommand('pmd', [
            report      : reportDir.get().file('pmd.sarif').asFile.absolutePath,
            rulesets    : reportDir.get().file('pmd-rulesets.txt').asFile.text.split(',').toList(),
            auxClasspath: auxClasspath.absolutePath,
            directories : lintedSources()*.absolutePath,
        ], temporaryDir)
        args command.args
    }
    doLast {
        def code = executionResult.get().exitValue
        if (!command.accepts(code)) {
            throw new GradleException("PMD failed with exit code ${code} and wrote no report")
        }
    }
}
