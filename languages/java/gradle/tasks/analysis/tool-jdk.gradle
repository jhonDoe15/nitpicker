def compilerVersion = { JavaCompile compile ->
    compile.javaCompiler.orNull?.metadata?.languageVersion?.asInt() ?: (JavaVersion.current().majorVersion as int)
}

def launcherOf = { int version ->
    project.extensions.getByType(JavaToolchainService).launcherFor {
        languageVersion = JavaLanguageVersion.of(version)
    }
}

def currentJava = { ->
    def current = JavaVersion.current().majorVersion as int
    def home = System.getProperty('java.home')
    [java: new File(home, 'bin/java').absolutePath, launcher: launcherOf(current), home: home]
}

def toolchainJava = { int version ->
    def launcher = launcherOf(version)
    [java: launcher.get().executablePath.asFile.absolutePath, launcher: launcher,
     home: launcher.get().metadata.installationPath.asFile.absolutePath]
}

def olderJava = { String tool, int minimum, int maximum, int current ->
    try {
        return toolchainJava(maximum)
    } catch (Exception ignored) {
        return currentJava() + [skipped: "${tool} runs on JDK ${minimum} to ${maximum} only, and Gradle runs on " +
            "JDK ${current}. Gradle found no JDK ${maximum}: install one where Gradle looks for toolchains, or " +
            "let Gradle download it (the org.gradle.toolchains.foojay-resolver-convention plugin)"]
    }
}

project.ext.nitpickerToolJava = { String tool, int minimum, Collection<JavaCompile> compiles,
                                  int maximum = Integer.MAX_VALUE ->
    def current = JavaVersion.current().majorVersion as int
    if (current > maximum) {
        return olderJava(tool, minimum, maximum, current)
    }
    def versions = compiles.collect { compilerVersion(it) }
    def preview = compiles.any { it.options.compilerArgs.contains('--enable-preview') }
    def projectVersion = versions ? versions.max() : current
    def wanted = preview ? projectVersion : Math.max(minimum, projectVersion)
    if (wanted < minimum) {
        return currentJava() + [skipped: "${tool} needs JDK ${minimum} or newer, and this project compiles " +
            "with --enable-preview on JDK ${wanted}, whose preview features only that JDK compiles. Move " +
            "the build to JDK ${minimum} or newer, or drop --enable-preview"]
    }
    if (current == wanted || (!preview && current > wanted)) {
        return currentJava()
    }
    try {
        return toolchainJava(wanted)
    } catch (Exception ignored) {
        return currentJava() + [skipped: "${tool} needs a JDK ${wanted} for this project (JDK ${minimum} or " +
            "newer, and at least the project's own JDK), and Gradle runs on JDK ${current}. Gradle found no " +
            "JDK ${wanted}: run Gradle on JDK ${wanted}, install one where Gradle looks for toolchains, or " +
            "let Gradle download it (the org.gradle.toolchains.foojay-resolver-convention plugin); the " +
            "project keeps compiling for its own release"]
    }
}

project.ext.nitpickerProjectJavaHome = { ->
    tasks.named('compileJava').get().javaCompiler.orNull?.metadata?.installationPath?.asFile?.absolutePath ?:
        System.getProperty('java.home')
}

project.ext.nitpickerJavaCompiles = {
    ([tasks.named('compileJava').get()] + project.ext.nitpickerTestSourceSets().collect {
        tasks.named(it.compileJavaTaskName).get()
    }).findAll { !it.source.isEmpty() }
}
