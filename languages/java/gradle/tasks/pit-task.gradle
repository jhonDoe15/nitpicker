def pinned = project.ext.nitpickerPinned
def reportDir = project.ext.nitpickerReportDir
def archunitIncludes = project.ext.nitpickerArchunitIncludes
def mainSources = sourceSets.main.allJava.sourceDirectories
def mutatedClassDirs = { sourceSets.main.output.classesDirs.files }
def failedTestClasses = project.ext.nitpickerFailedTestClasses
def unnamedTestFailures = project.ext.nitpickerUnnamedTestFailures
def skipAfterFailingTests = project.ext.nitpickerSkipAfterFailingTests
def testClassNames = {
    sourceSets.test.output.classesDirs.files.findAll { it.exists() }.collectMany { dir ->
        fileTree(dir) { include '**/*.class'; exclude archunitIncludes }.files.collect {
            dir.toPath().relativize(it.toPath()).toString().replace('\\', '/')
                .replaceAll(/\.class$/, '').replace('/', '.').replaceAll(/\$.*/, '')
        }
    }.unique()
}
def mutationAfterFailingTests = {
    def unnamed = unnamedTestFailures()
    if (!unnamed.isEmpty()) {
        skipAfterFailingTests('pit', "the test task ${unnamed.join(', ')} failed without naming a failing test, " +
            'so nitpicker cannot tell which test classes to leave out')
        return false
    }
    def failed = failedTestClasses()
    if (!failed.isEmpty() && testClassNames().every { it in failed }) {
        skipAfterFailingTests('pit', 'every test class has a failing test, so no passing test is left to kill mutants')
        return false
    }
    true
}

configurations {
    nitpickerPit { canBeConsumed = false }
    nitpickerPitJunit5 { canBeConsumed = false }
}
dependencies {
    nitpickerPit "org.pitest:pitest-command-line:${pinned.pitest}"
    nitpickerPitJunit5("org.pitest:pitest-junit5-plugin:${pinned.pitestJunit5}") {
        exclude group: 'org.junit.platform'
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.opentest4j'
        exclude group: 'org.apiguardian'
    }
}

tasks.register('nitpickerPit', JavaExec) {
    group = 'nitpicker'
    dependsOn tasks.named('classes'), tasks.named('testClasses')
    classpath = configurations.nitpickerPit
    mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
    def pitDir = reportDir.map { it.dir('pit') }
    doFirst {
        def classDirs = mutatedClassDirs().findAll { it.exists() }
        def classNames = { File dir, String prefix ->
            (dir.listFiles() ?: []).findAll { it.isFile() && it.name.endsWith('.class') }
                .collect { "${prefix}${it.name.replaceAll(/\.class$/, '')}".toString() }
        }
        def packageTargets
        packageTargets = { File dir, String prefix ->
            def subpackages = { (dir.listFiles() ?: []).findAll { it.isDirectory() }
                .collectMany { packageTargets(it, "${prefix}${it.name}.".toString()) } }
            def classes = classNames(dir, prefix)
            classes.isEmpty() ? subpackages()
                : 'org.pitest.'.startsWith(prefix) ? classes + subpackages()
                : ["${prefix}*".toString()]
        }
        def targets = classDirs.collectMany { dir -> packageTargets(dir, '') }.unique().sort()
        def tests = testClassNames()
        def excludedTests = failedTestClasses().collectMany { [it, "${it}\$*".toString()] }
        def runtimeJars = sourceSets.test.runtimeClasspath.files*.name
        def engineJar = runtimeJars.find { it ==~ /junit-platform-engine-.+\.jar/ }
        def engine = engineJar?.replaceAll(/^junit-platform-engine-|\.jar$/, '')
        if (engine != null) {
            classpath += configurations.nitpickerPitJunit5
        }
        if (engine != null && !runtimeJars.any { it.startsWith('junit-platform-launcher-') }) {
            classpath += project.configurations.detachedConfiguration(
                project.dependencies.create("org.junit.platform:junit-platform-launcher:${engine}"))
        }
        project.delete(pitDir)
        pitDir.get().asFile.mkdirs()
        def pitClasspath = (sourceSets.test.runtimeClasspath.files + classDirs)
            .findAll { it.exists() }.collect { it.absolutePath }.unique()
        args(['--reportDir', pitDir.get().asFile.absolutePath,
              '--targetClasses', targets.join(','),
              '--targetTests', tests.join(','),
              '--sourceDirs', mainSources.files.findAll { it.exists() }.join(','),
              '--classPath', pitClasspath.join(','),
              '--mutableCodePaths', classDirs.collect { it.absolutePath }.join(','),
              '--outputFormats', 'XML',
              '--timestampedReports', 'false',
              '--threads', '2',
              '--failWhenNoMutations', 'false',
              '--verbose', 'false'] +
             (excludedTests.isEmpty() ? [] : ['--excludedTestClasses', excludedTests.join(',')]))
    }
    mustRunAfter tasks.withType(Test)
    onlyIf { mutatedClassDirs().any { it.exists() && it.list()?.length } }
    onlyIf { mutationAfterFailingTests() }
    doLast {
        def report = pitDir.get().file('mutations.xml').asFile
        if (!report.exists()) {
            report.text = '<mutations/>'
        }
    }
}
