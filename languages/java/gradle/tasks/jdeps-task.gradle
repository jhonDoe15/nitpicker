def reportDir = project.ext.nitpickerReportDir
def toolCommand = project.ext.nitpickerToolCommand
def classFiles = { File dir ->
    def root = dir.toPath()
    java.nio.file.Files.walk(root).withCloseable { paths ->
        paths.filter { java.nio.file.Files.isRegularFile(it, java.nio.file.LinkOption.NOFOLLOW_LINKS) }
            .filter { it.fileName.toString().endsWith('.class') }
            .map { root.relativize(it) }
            .collect(java.util.stream.Collectors.toList())
    }
}

tasks.register('nitpickerJdeps') {
    group = 'nitpicker'
    dependsOn tasks.named('classes')
    inputs.file(project.ext.nitpickerToolCommandsFile).withPropertyName('toolCommands')
    doLast {
        reportDir.get().asFile.mkdirs()
        def classDirs = sourceSets.main.output.classesDirs.files.findAll { it.exists() }
        def classNames = classDirs.collectMany { dir ->
            classFiles(dir).findAll { !(it.fileName.toString() in ['module-info.class', 'package-info.class']) }
                .collect { it.toString().replace('\\', '/').replaceAll(/\.class$/, '').replace('/', '.') }
        }.unique().sort()
        reportDir.get().file('jdeps-classes.txt').asFile.text = classNames.collect { it + '\n' }.join('')
        def graph = reportDir.get().file('jdeps.txt').asFile
        if (classNames.isEmpty()) {
            graph.text = ''
            return
        }
        def jdeps = new File(System.getProperty('java.home'), 'bin/jdeps')
        def modular = classDirs.findAll { new File(it, 'module-info.class').isFile() }
        def buildDir = layout.buildDirectory.get().asFile
        buildDir.mkdirs()
        def staged = modular
            ? java.nio.file.Files.createTempDirectory(buildDir.toPath(), 'nitpicker-jdeps-').toFile()
            : null
        try {
            def analyzed = classDirs.withIndex().collect { dir, index ->
                if (!modular.contains(dir)) {
                    return dir
                }
                def copy = new File(staged, index.toString())
                classFiles(dir).findAll { it.fileName.toString() != 'module-info.class' }.each { relative ->
                    def target = copy.toPath().resolve(relative)
                    java.nio.file.Files.createDirectories(target.parent)
                    java.nio.file.Files.copy(dir.toPath().resolve(relative), target)
                }
                copy
            }
            def command = toolCommand('jdeps', [classDirectories: analyzed*.absolutePath])
            def process = new ProcessBuilder([jdeps.absolutePath] + command.args).directory(projectDir).start()
            def stdout = new ByteArrayOutputStream()
            def stderr = new ByteArrayOutputStream()
            process.waitForProcessOutput(stdout, stderr)
            if (!command.accepts(process.exitValue())) {
                def jvmNoise = ~/^(?:Picked up (?:JAVA_TOOL_OPTIONS|_JAVA_OPTIONS|JDK_JAVA_OPTIONS)|NOTE: Picked up)/
                def lines = stderr.toString('UTF-8').readLines().findAll { it.trim() && !(it =~ jvmNoise) }
                def errors = lines.findAll { it =~ /Error|Exception|Caused by/ }
                def detail = (errors ?: lines).take(10).join('\n')
                throw new GradleException("jdeps failed (${jdeps}) with exit code ${process.exitValue()}: ${detail}")
            }
            graph.text = stdout.toString('UTF-8')
        } finally {
            staged?.deleteDir()
        }
    }
}
tasks.named('nitpickerJava') { dependsOn 'nitpickerJdeps' }
