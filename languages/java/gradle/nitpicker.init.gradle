def nitpickerArgument = { String name -> gradle.startParameter.projectProperties[name] }
def nitpickerStyle = {
    def file = nitpickerArgument('nitpicker.kotlin.styleFile')
    file == null ? [:] : new groovy.json.JsonSlurper().parse(new File(file.toString()), 'UTF-8')
