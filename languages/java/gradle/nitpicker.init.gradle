def analysisRoot = gradle.startParameter.currentDir
def reportBase = nitpickerArgument('nitpicker.reportDir')
def javaModules = []

def relativeToRoot = { File file ->
    analysisRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
}

def runProcess = { String name, List<String> command, File directory ->
    def process = new ProcessBuilder(command).directory(directory).redirectErrorStream(true).start()
    def log = process.inputStream.getText('UTF-8')
    if (process.waitFor() != 0) {
        throw new GradleException("${name} failed: ${log.trim()}".toString())
    }
}

def kotlinPsiKeys = [] as Set
def javacIn = { String javaHome ->
    def bin = new File(javaHome, 'bin')
    def javac = ['javac', 'javac.exe'].collect { new File(bin, it) }.find { it.isFile() }
    if (javac == null) {
        def where = javaHome == System.getProperty('java.home') ? 'Gradle runs on' : 'the JDK it picked is'
        throw new GradleException(("The kotlin preset compiles its Kotlin parser with javac, and ${where} " +
            "${javaHome}, a Java runtime without javac. Run the build on a JDK (Java 21): " +
            'point JAVA_HOME or org.gradle.java.home at one.').toString())
    }
    javac
}
def kotlinPsiClasses = { project, String compiler, String javaHome ->
    def javac = javacIn(javaHome)
    def sources = project.fileTree(new File(initScriptDir, 'kotlin-psi')) { include '**/*.java' }.files
        .sort { it.absolutePath }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    ([pinned.kotlinCompiler, javaHome, compiler] +
        sources.collect { it.absolutePath + '\n' + it.getText('UTF-8') }).each {
        digest.update((it + '\u0000').getBytes('UTF-8'))
    }
    def root = project.rootProject.layout.buildDirectory.dir('tmp/nitpickerKotlinPsi').get().asFile
    def classes = new File(root, digest.digest().encodeHex().toString().take(16))
    synchronized (kotlinPsiKeys) {
        if (!kotlinPsiKeys.contains(classes.name) && !classes.isDirectory()) {
            root.mkdirs()
            root.listFiles().findAll { !kotlinPsiKeys.contains(it.name) }.each { project.delete(it) }
            def staging = new File(root, classes.name + '.compiling')
            staging.mkdirs()
            runProcess('javac', [javac.absolutePath, '-proc:none', '-d', staging.absolutePath, '-cp', compiler] +
                sources.collect { it.absolutePath }, project.projectDir)
            if (!staging.renameTo(classes)) {
                throw new GradleException("nitpicker could not move the compiled kotlin-psi program to ${classes}")
            }
        }
        kotlinPsiKeys << classes.name
    }
    classes
}

gradle.projectsEvaluated {
