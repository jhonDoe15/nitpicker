def pinned = [
    pmd             : '7.7.0',
    forbiddenapis   : '3.10',
    spotbugs        : '4.9.3',
    googleJavaFormat: '1.25.2',
    jacoco          : '0.8.12',
    checkstyle      : '10.21.1',
    lizard          : '1.24.1',
    pitest          : '1.17.4',
    pitestJunit5    : '1.2.1',
    detekt          : '1.23.8',
    detektKotlin    : '2.0.21',
    ktlint          : '1.8.0',
    ktfmt           : '0.64',
    kotlinCompiler  : '2.4.21',
    errorProne      : '2.50.0',
    nullAway        : '0.14.2',
]

def initScriptDir = buildscript.sourceFile.parentFile

def nitpickerArgument = { String name -> gradle.startParameter.projectProperties[name] }

def analysisRoot = gradle.startParameter.currentDir
def reportBase = nitpickerArgument('nitpicker.reportDir')
def javaModules = []

def relativeToRoot = { File file ->
    analysisRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
}

gradle.projectsEvaluated {
    if (reportBase && gradle.parent == null) {
        def modules = new File(reportBase.toString(), 'modules.json')
        modules.parentFile.mkdirs()
        modules.text = groovy.json.JsonOutput.toJson(javaModules)
    }
}

def nodeCommand = nitpickerArgument('nitpicker.node') ?: 'node'
def rulesWriter = new File(initScriptDir, '../builds/rulesets/write-rules.mjs').canonicalFile
def runNode = { File script, List<String> arguments, String failure ->
    def process = new ProcessBuilder([nodeCommand, script.absolutePath] + arguments)
        .redirectErrorStream(true).start()
    def log = process.inputStream.getText('UTF-8')
    if (process.waitFor() != 0) {
        throw new GradleException("${failure}: ${log.trim()}")
    }
}
def writeRules = { String kind, File plan ->
    runNode(rulesWriter, [kind, plan.absolutePath], "nitpicker could not write the ${kind} configuration")
}
def toolCommandsFile = new File(initScriptDir, '../builds/tools/tool-commands.json').canonicalFile
def toolCommandsScript = new File(initScriptDir, '../builds/tools/tool-commands.mjs').canonicalFile
def toolLauncher = { String tool ->
    def launcher = new groovy.json.JsonSlurper().parse(toolCommandsFile)[tool].launcher
    launcher == null ? null : new File(toolCommandsFile.parentFile, launcher).canonicalFile
}
def toolCommand = { String tool, Map values, File directory ->
    directory.mkdirs()
    def valuesFile = new File(directory, "${tool}-values.json")
    def commandFile = new File(directory, "${tool}-command.json")
    valuesFile.text = groovy.json.JsonOutput.toJson(values)
    runNode(toolCommandsScript, [tool, valuesFile.absolutePath, commandFile.absolutePath],
        "nitpicker could not build the ${tool} command line")
    def command = new groovy.json.JsonSlurper().parse(commandFile)
    def accept = command.accept
    [
        launcher: command.launcher == null ? null : new File(command.launcher),
        args    : command.args,
        accepts : { int code ->
            def report = accept.report == null ? null : new File(accept.report)
            (accept.exits == null || code in accept.exits) && (report == null || (report.isFile() &&
                (accept.reportPattern == null || (report.getText('UTF-8') =~ accept.reportPattern).find())))
        },
    ]
}
def compilerOf = { compile ->
    [
        release : compile.options.release.orNull?.toString(),
        source  : compile.sourceCompatibility,
        target  : compile.targetCompatibility,
        encoding: compile.options.encoding,
        args    : compile.options.allCompilerArgs.collect { it.toString() },
    ]
}

allprojects {
    plugins.withId('java') {
        project.ext.nitpickerPinned = pinned
        pluginManager.apply('jacoco')
        pluginManager.apply('checkstyle')

        def moduleKey = project == rootProject ? 'root'
            : 'module-' + project.path.substring(1).replace('_', '_u').replace(':', '_c')
        def reportDir = reportBase && gradle.parent == null
            ? objects.directoryProperty().fileValue(new File(reportBase.toString(), moduleKey))
            : layout.buildDirectory.dir('nitpicker')
        if (project.projectDir.toPath().startsWith(analysisRoot.toPath())) {
            javaModules << [key: moduleKey, path: project.path, dir: relativeToRoot(project.projectDir)]
        }
        def kotlinPreset = nitpickerArgument('nitpicker.kotlin') == 'true'
        project.ext.nitpickerReportDir = reportDir
        project.ext.nitpickerRelativeToRoot = relativeToRoot
        project.ext.nitpickerAnalysisRoot = analysisRoot
        project.ext.nitpickerCompilerOf = compilerOf
        project.ext.nitpickerToolCommand = toolCommand
        project.ext.nitpickerToolCommandInputs = [toolCommandsFile, toolCommandsScript]
        project.ext.nitpickerToolLauncher = toolLauncher
        project.ext.nitpickerRunNode = runNode
        project.ext.nitpickerWriteRules = writeRules

        configurations {
            nitpickerPmd { canBeConsumed = false }
            nitpickerSpotbugs { canBeConsumed = false }
            nitpickerFormat { canBeConsumed = false }
            nitpickerCheckstyle { canBeConsumed = false }
        }
        repositories { mavenCentral() }
        dependencies {
            nitpickerPmd "net.sourceforge.pmd:pmd-cli:${pinned.pmd}"
            nitpickerPmd "net.sourceforge.pmd:pmd-java:${pinned.pmd}"
            nitpickerSpotbugs "com.github.spotbugs:spotbugs:${pinned.spotbugs}"
            nitpickerFormat "com.google.googlejavaformat:google-java-format:${pinned.googleJavaFormat}"
            nitpickerCheckstyle "com.puppycrawl.tools:checkstyle:${pinned.checkstyle}"
        }
    jacoco { toolVersion = pinned.jacoco }
        def nitpickerCheckstyleConfig = layout.buildDirectory.file('nitpicker-checkstyle/checkstyle.xml')
        def nitpickerCheckstyleTestConfig = layout.buildDirectory.file('nitpicker-checkstyle/checkstyle-test.xml')
        def projectCheckstyleConfig = nitpickerArgument('nitpicker.checkstyle.projectConfig')
        def checkstyleJarName = "checkstyle-${pinned.checkstyle}.jar".toString()
        def checkstyleJar = configurations.nitpickerCheckstyle.filter { it.name == checkstyleJarName }
        def writeCheckstyleConfig = tasks.register('nitpickerCheckstyleConfig') {
            group = 'nitpicker'
            inputs.files(checkstyleJar)
            inputs.dir(new File(initScriptDir, 'rules'))
            inputs.dir(rulesWriter.parentFile)
            outputs.files(nitpickerCheckstyleConfig, nitpickerCheckstyleTestConfig)
            doLast {
                def directory = nitpickerCheckstyleConfig.get().asFile.parentFile
                directory.mkdirs()
                def plan = new File(directory, 'checkstyle-plan.json')
                plan.text = groovy.json.JsonOutput.toJson([
                    checkstyleJar: checkstyleJar.singleFile.absolutePath,
                    directory    : directory.absolutePath,
                ])
                writeRules('checkstyle', plan)
            }
        }
        checkstyle { toolVersion = pinned.checkstyle }
        afterEvaluate {
            tasks.withType(Checkstyle).configureEach { task ->
                ignoreFailures = true
                showViolations = false
                maxWarnings = Integer.MAX_VALUE
                if (projectCheckstyleConfig) {
                    configFile = file(projectCheckstyleConfig)
                } else {
                    dependsOn writeCheckstyleConfig
                    checkstyleClasspath = configurations.nitpickerCheckstyle
                    def config = task.name == 'checkstyleMain'
                        ? nitpickerCheckstyleConfig : nitpickerCheckstyleTestConfig
                    configFile = config.get().asFile
                    configProperties = ['org.checkstyle.google.suppressionfilter.config':
                        new File(initScriptDir, 'checkstyle-suppressions.xml').absolutePath]
                }
            }
        }
        tasks.withType(Checkstyle).configureEach { checkstyleTask ->
            def sourceSetName = checkstyleTask.name.substring('checkstyle'.length())
            sourceSetName = sourceSetName[0].toLowerCase() + sourceSetName.substring(1)
            def report = sourceSetName == 'main' ? 'checkstyle.xml' : "checkstyle-${sourceSetName}.xml".toString()
            reports {
                xml.required = true
                xml.outputLocation = reportDir.map { it.file(report) }
                html.required = false
            }
        }

        def mainSources = sourceSets.main.allJava.sourceDirectories
        def testSourceDirectories = {
            sourceSets.findAll { it.name != 'main' }.collectMany { it.allJava.sourceDirectories.files }.unique()
        }
        def analyzedClassDirs = {
            kotlinPreset ? [tasks.named('compileJava').get().destinationDirectory.get().asFile]
                : sourceSets.main.output.classesDirs.files
        }
        project.ext.nitpickerAnalyzedClassDirs = analyzedClassDirs
        project.ext.nitpickerTestSourceDirectories = testSourceDirectories
        project.ext.nitpickerKotlinPreset = kotlinPreset

        def usesSpring = {
            sourceSets.main.compileClasspath.files.any { it.name ==~ /spring-(context|boot)-.*\.jar/ }
        }
        project.ext.nitpickerUsesSpring = usesSpring
        def hasGuava = { sourceSet -> sourceSet.compileClasspath.files.any { it.name ==~ /guava-\d.*\.jar/ } }

        def archunitIncludes = (findProperty('nitpicker.archunit.includes')
            ?: '**/*ArchTest.class,**/*ArchitectureTest.class')
            .toString().split(',')*.trim().findAll { it }

        project.ext.nitpickerArchunitIncludes = archunitIncludes
        tasks.named('test') { exclude archunitIncludes }

        tasks.register('nitpickerArchunit', Test) {
            group = 'nitpicker'
            dependsOn tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            include archunitIncludes
            useJUnitPlatform()
            ignoreFailures = true
            reports {
                junitXml.outputLocation = reportDir.map { it.dir('archunit') }
                html.required = false
            }
        }

        tasks.register('nitpickerJacoco') {
            group = 'nitpicker'
            dependsOn tasks.named('test'), tasks.named('jacocoTestReport')
            doLast {
                copy {
                    from tasks.named('jacocoTestReport').get().reports.xml.outputLocation
                    into reportDir
                    rename { 'jacoco.xml' }
                }
            }
        }
        def emptyExecutionData = reportDir.map { it.file('jacoco-empty.exec') }
        def writeEmptyExecutionData = tasks.register('nitpickerJacocoEmptyData') {
            group = 'nitpicker'
            outputs.file(emptyExecutionData)
            doLast { emptyExecutionData.get().asFile.with { parentFile.mkdirs(); bytes = new byte[0] } }
        }
        tasks.named('jacocoTestReport') {
            reports { xml.required = true }
            dependsOn writeEmptyExecutionData
            executionData(emptyExecutionData)
        }
        gradle.projectsEvaluated {
            tasks.withType(Test).configureEach {
                def coverage = extensions.findByType(JacocoTaskExtension)
                if (coverage != null) {
                    coverage.enabled = true
                    coverage.includes = []
                    coverage.excludes = []
                    coverage.excludeClassLoaders = []
                }
            }
            tasks.named('jacocoTestReport') {
                enabled = true
                classDirectories.setFrom(sourceSets.main.output.classesDirs)
            }
        }

        project.ext.nitpickerErrorProneVersions = pinned.subMap(['errorProne', 'nullAway'])
        project.apply from: new File(initScriptDir, 'errorprone/error-prone.gradle')

        tasks.register('nitpickerJava') {
            group = 'nitpicker'
            description = 'Runs PMD, SpotBugs, Error Prone, the formatter check, JaCoCo, Checkstyle, ' +
                'ArchUnit rule tests, structure metrics and PIT; reports go to build/nitpicker.'
            dependsOn 'nitpickerPmd', 'nitpickerSpotbugs', 'nitpickerErrorProne', 'nitpickerFormat',
                'nitpickerJacoco', 'nitpickerArchunit', 'nitpickerStructure', 'nitpickerPit'
            dependsOn { tasks.withType(Checkstyle) }
            doLast {
                def ranTests = tasks.withType(Test).findAll {
                    it.name != 'nitpickerArchunit' && gradle.taskGraph.hasTask(it)
                }
                ranTests.each { testTask ->
                    copy {
                        from(testTask.reports.junitXml.outputLocation) { include 'TEST-*.xml' }
                        into reportDir.get().dir("test-results/${testTask.name}")
                    }
                }
                def roots = mainSources.files.collect { relativeToRoot(it) }
                def testRoots = testSourceDirectories().collect { relativeToRoot(it) }
                def resourceRoots = sourceSets.main.resources.srcDirs.collect { relativeToRoot(it) }
                reportDir.get().file('manifest.json').asFile.text = groovy.json.JsonOutput.toJson([
                    versions       : pinned,
                    moduleKey      : moduleKey,
                    sourceRoots    : roots,
                    testSourceRoots: testRoots,
                    resourceRoots  : resourceRoots,
                    spring         : usesSpring(),
                    guava          : hasGuava(sourceSets.main),
                    testGuava      : hasGuava(sourceSets.test),
                ])
            }
        }

        ['analysis/pmd-task.gradle', 'analysis/spotbugs-task.gradle', 'analysis/format-task.gradle',
         'structure-task.gradle', 'jdeps-task.gradle', 'lint-tasks.gradle', 'cpd-task.gradle',
         'dependency-tasks.gradle', 'pit-task.gradle'].each {
            project.apply from: new File(initScriptDir, "tasks/${it}")
        }

        if (kotlinPreset) {
            project.apply from: new File(initScriptDir, 'tasks/kotlin/kotlin-tasks.gradle')
        }
    }
}
