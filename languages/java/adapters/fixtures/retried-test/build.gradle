plugins {
    id 'java'
    id 'org.gradle.test-retry' version '1.6.6'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
    retry {
        maxRetries = 2
        failOnPassedAfterRetry = false
    }
}
