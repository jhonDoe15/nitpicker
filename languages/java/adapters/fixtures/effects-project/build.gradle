plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly 'org.springframework:spring-context:6.2.10'
    compileOnly 'org.springframework:spring-web:6.2.10'
    compileOnly 'org.springframework:spring-tx:6.2.10'
    compileOnly 'org.springframework.data:spring-data-jpa:3.5.3'
    compileOnly 'org.springframework.kafka:spring-kafka:3.3.0'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    compileOnly('org.hibernate.orm:hibernate-core:6.6.20.Final') { transitive = false }
    compileOnly 'org.springframework:spring-jdbc:6.2.10'
    compileOnly 'org.springframework.retry:spring-retry:2.0.13'
    compileOnly 'io.projectreactor:reactor-core:3.7.5'
    compileOnly('org.springframework.graphql:spring-graphql:1.3.5') { transitive = false }
    compileOnly('com.netflix.graphql.dgs:graphql-dgs:10.0.4') { transitive = false }
    compileOnly('org.quartz-scheduler:quartz:2.3.2') { transitive = false }
    compileOnly('io.awspring.cloud:spring-cloud-aws-sqs:3.3.0') { transitive = false }
    compileOnly('com.stripe:stripe-java:29.0.0') { transitive = false }
}
