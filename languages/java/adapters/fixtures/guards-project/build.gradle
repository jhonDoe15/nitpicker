plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.commons:commons-text:1.13.0' // file violation: dependencies/unused-declared-dependency
    compileOnly 'org.springframework:spring-web:6.2.10'
    compileOnly 'org.springframework.security:spring-security-config:6.5.3'
    compileOnly 'org.springframework.security:spring-security-web:6.5.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.19.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}
