plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    compileOnly('org.apache.tomcat.embed:tomcat-embed-core:10.1.44') { transitive = false }
    compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    compileOnly 'io.micronaut:micronaut-http:4.9.9'
    compileOnly 'io.vertx:vertx-web:4.5.21'
    compileOnly 'org.springframework:spring-webflux:6.2.10'
}
