plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.5')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'io.projectreactor:reactor-core'
    implementation 'org.springframework:spring-web'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api'
    implementation 'org.jboss.logging:jboss-logging'
    implementation 'org.apache.logging.log4j:log4j-api'
    compileOnly platform('org.springframework.boot:spring-boot-dependencies:3.5.5')
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.5.5')
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.5.5')
    testCompileOnly platform('org.springframework.boot:spring-boot-dependencies:3.5.5')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.awaitility:awaitility'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.5.5')
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
    testImplementation 'io.github.artsok:rerunner-jupiter:2.1.6'
    testImplementation 'org.testng:testng:7.10.2'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'junit:junit'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
