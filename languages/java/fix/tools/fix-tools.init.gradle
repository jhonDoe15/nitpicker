def specs = (gradle.startParameter.projectProperties['nitpicker.fix.tools'] ?: '').toString()
    .split(',')*.trim().findAll { it }
def settingsRepositories = false

gradle.settingsEvaluated { settings ->
    settingsRepositories = !settings.dependencyResolutionManagement.repositories.isEmpty()
}

gradle.rootProject { root ->
    if (!settingsRepositories) {
        root.repositories { mavenCentral() }
    }
    root.tasks.register('nitpickerFixTools') {
        doLast {
            specs.each { spec ->
                def parts = spec.split('=', 2)
                def transitive = !parts[1].endsWith('!')
                def notation = transitive ? parts[1] : parts[1].substring(0, parts[1].length() - 1)
                def dependency = root.dependencies.create(notation)
                dependency.transitive = transitive
                def files = root.configurations.detachedConfiguration(dependency).resolve()
                println "nitpicker-fix-tool\t${parts[0]}\t${files.collect { it.absolutePath }.join(File.pathSeparator)}"
            }
        }
    }
}
