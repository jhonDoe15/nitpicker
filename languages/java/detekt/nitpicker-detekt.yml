# Nitpicker's detekt rules for the Kotlin preset (detekt 1.23.8). Laid over detekt's defaults and over the
# project's own detekt config, so a project cannot switch these rules off, lower their severity, exclude
# paths or skip annotated code in detekt.yml: every rule below sets active, severity, includes, excludes and
# ignoreAnnotated itself. Lift them per path with "exceptions" in nitpicker.config.json. The rule list is
# languages/java/adapters/kotlin/rules/kotlin-rules.mjs.
# Rules here that need type resolution run because the detekt task passes the module's classpath.

potential-bugs:
  active: true
  excludes: []
  ignoreAnnotated: []
  includes: []
  UnsafeCallOnNullableType:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []
  CastNullableToNonNullableType:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []
  CastToNullableType:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []
  DontDowncastCollectionTypes:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []

exceptions:
  active: true
  excludes: []
  ignoreAnnotated: []
  includes: []
  TooGenericExceptionCaught:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'IndexOutOfBoundsException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: ''

coroutines:
  active: true
  excludes: []
  ignoreAnnotated: []
  includes: []
  GlobalCoroutineUsage:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []

style:
  active: true
  excludes: []
  ignoreAnnotated: []
  includes: []
  ForbiddenMethodCall:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []
    methods:
      - value: 'kotlin.run'
        reason: 'Use `let` to name a value for a block (`value?.let { ... }` for null), or call the code directly.'
      - value: 'kotlin.with'
        reason: 'Use `apply` to configure an object (`StringBuilder().apply { ... }`), or call the members on the receiver.'
      - value: 'kotlin.also'
        reason: 'Use `apply` to configure an object, or write a plain statement after it.'
      - value: 'kotlinx.coroutines.runBlocking'
        reason: 'Make the caller `suspend` (`suspend fun main()` for an entry point) and use `coroutineScope { ... }` for concurrent work. In a test, use `runTest`.'
      - value: 'kotlin.io.print'
        reason: 'Log through the application logger (`logger.info(...)`) instead of printing to the console.'
      - value: 'kotlin.io.println'
        reason: 'Log through the application logger (`logger.info(...)`) instead of printing to the console.'
      - value: 'java.lang.System.getenv'
        reason: 'Read environment variables only in the composition root (the file with `fun main`, the `@SpringBootApplication` class or a Ktor `Application` module): read them once into a config class there and pass it in.'
      - value: 'java.time.Instant.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.LocalDate.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.LocalDate.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.LocalDateTime.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.LocalDateTime.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.LocalTime.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.LocalTime.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.ZonedDateTime.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.ZonedDateTime.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.OffsetDateTime.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.OffsetDateTime.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.OffsetTime.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.OffsetTime.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.Year.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.Year.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.YearMonth.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.YearMonth.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.MonthDay.now()'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.time.MonthDay.now(java.time.ZoneId)'
        reason: 'Inject a `java.time.Clock` and call `now(clock)` (`Instant.now(clock)`), so the code can be tested with a fixed time.'
      - value: 'java.lang.System.currentTimeMillis'
        reason: 'Inject a `java.time.Clock` and call `clock.millis()`, so the code can be tested with a fixed time.'
      - value: 'kotlinx.datetime.Clock.System.now'
        reason: 'Inject a `kotlinx.datetime.Clock` and call `clock.now()`, so the code can be tested with a fixed time.'
      - value: 'kotlin.random.Random.Default.nextBits'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.random.Random.Default.nextBoolean'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.random.Random.Default.nextBytes'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.random.Random.Default.nextDouble'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.random.Random.Default.nextFloat'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.random.Random.Default.nextInt'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.random.Random.Default.nextLong'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.collections.random(kotlin.collections.Collection)'
        reason: 'Pass an injected `kotlin.random.Random`: `items.random(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.collections.random(kotlin.Array)'
        reason: 'Pass an injected `kotlin.random.Random`: `items.random(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.ranges.random(kotlin.ranges.IntRange)'
        reason: 'Pass an injected `kotlin.random.Random`: `range.random(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.ranges.random(kotlin.ranges.LongRange)'
        reason: 'Pass an injected `kotlin.random.Random`: `range.random(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.ranges.random(kotlin.ranges.CharRange)'
        reason: 'Pass an injected `kotlin.random.Random`: `range.random(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.collections.shuffled(kotlin.collections.Iterable)'
        reason: 'Pass an injected `kotlin.random.Random`: `items.shuffled(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.collections.shuffle(kotlin.collections.MutableList)'
        reason: 'Pass an injected `kotlin.random.Random`: `items.shuffle(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'kotlin.collections.shuffle(kotlin.Array)'
        reason: 'Pass an injected `kotlin.random.Random`: `items.shuffle(random)`, so the code can be tested with `Random(seed)`.'
      - value: 'java.lang.Math.random'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'java.util.concurrent.ThreadLocalRandom.current'
        reason: 'Inject a `kotlin.random.Random` and call it (`random.nextInt(6)`), so the code can be tested with `Random(seed)`.'
      - value: 'java.lang.Thread.sleep'
        reason: 'Do not sleep in production code. Schedule the work (`ScheduledExecutorService`) or wait on the condition.'
      - value: 'java.util.concurrent.TimeUnit.sleep'
        reason: 'Do not sleep in production code. Schedule the work (`ScheduledExecutorService`) or wait on the condition.'
      - value: 'java.lang.Runtime.exec'
        reason: 'Run commands with `ProcessBuilder` and an argument list (`ProcessBuilder("git", "log", ref)`), never a command string.'
      - value: 'java.io.ObjectInputStream.<init>'
        reason: 'Do not read Java-serialized objects. Use JSON or another data format (kotlinx.serialization).'
      - value: 'java.lang.Thread.start'
        reason: 'Do not start threads by hand. Launch a coroutine in a scope its owner cancels, or submit the work to an injected `ExecutorService`.'
      - value: 'kotlin.concurrent.thread'
        reason: 'Do not start threads by hand. Launch a coroutine in a scope its owner cancels, or submit the work to an injected `ExecutorService`.'
      - value: 'java.util.Date.<init>'
        reason: 'Use java.time (`Instant`, `LocalDate`, `ZonedDateTime`, `ZoneId` and `DateTimeFormatter`) instead of the legacy date classes. Convert a `Date` another API returns with `toInstant()` in the same expression.'
      - value: 'java.util.GregorianCalendar.<init>'
        reason: 'Use java.time (`Instant`, `LocalDate`, `ZonedDateTime`, `ZoneId` and `DateTimeFormatter`) instead of the legacy date classes. Convert a `Date` another API returns with `toInstant()` in the same expression.'
      - value: 'java.util.Calendar.getInstance'
        reason: 'Use java.time (`Instant`, `LocalDate`, `ZonedDateTime`, `ZoneId` and `DateTimeFormatter`) instead of the legacy date classes. Convert a `Date` another API returns with `toInstant()` in the same expression.'
      - value: 'java.text.SimpleDateFormat.<init>'
        reason: 'Use java.time (`Instant`, `LocalDate`, `ZonedDateTime`, `ZoneId` and `DateTimeFormatter`) instead of the legacy date classes. Convert a `Date` another API returns with `toInstant()` in the same expression.'
      - value: 'java.util.Random.<init>'
        reason: 'Use an injected `kotlin.random.Random` (`Random(seed)` in tests); `random.asJavaRandom()` where an API needs a `java.util.Random`.'
  ForbiddenImport:
    active: true
    severity: warning
    excludes: []
    ignoreAnnotated: []
    includes: []
    imports:
