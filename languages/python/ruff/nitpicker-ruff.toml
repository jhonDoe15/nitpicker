classmethod-decorators = [
  "pydantic.validator",
  "pydantic.root_validator",
  "sqlalchemy.orm.declared_attr",
  "sqlalchemy.ext.declarative.declared_attr",
  "sqlalchemy.orm.declared_attr.directive",
  "expression",
]
ignore-names = [
  "setUp",
  "tearDown",
  "setUpClass",
  "tearDownClass",
  "setUpModule",
  "tearDownModule",
  "asyncSetUp",
  "asyncTearDown",
  "setUpTestData",
  "failureException",
  "longMessage",
  "maxDiff",
  "assert*",
  "X",
  "X_*",
  "F",
]

[lint.flake8-unused-arguments]
ignore-variadic-names = true

# Reviewed exclusions for the pitfall families (Ruff 0.16.8 stable catalog).
# S101: assert is the native pytest assertion API; stripping it is not evidence of a defect.
# S103, S104: a file mode or server bind address alone does not establish exposure.
# S105, S106, S107: hardcoded-secret owns credential recognition with narrower evidence.
# S110, S112: swallowed-exception owns discarded failures, including log-only handlers.
# S310: a urlopen call alone does not establish an untrusted URL scheme.
# S311: random is valid for non-security work; this rule cannot identify security intent.
# S601: a Paramiko exec_command call alone does not establish command injection.
# S603, S606, S607: shell-free execution and PATH lookup alone do not establish injection.
# S608: sql-string-formatting owns query construction and parameterization evidence.
# TRY003: exception messages may be constructed at the raise site without changing semantics.
# TRY300, TRY301: moving a return or raise to another block does not establish better handling.
# PLW1641: defining equality without hashing intentionally makes mutable objects unhashable.
# Historical codes exposed by Ruff 0.9 catalogs, removed in the current stable catalog:
# S320, S410: lxml's hardened defaults make a blanket insecure-parser/import claim invalid.
# PT004, PT005: fixture underscore names do not establish whether a fixture is used correctly.
# TRY200: B904 already owns raising a replacement exception without an explicit cause.
