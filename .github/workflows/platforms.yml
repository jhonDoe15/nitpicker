name: platforms

# The CLI as a user runs it, on small sample projects (scripts/platforms/samples.mjs): the TypeScript strict-clean
# fixture, a Gradle and a Maven Java project and a Python project, each with `--all` and then with a change that adds
# one violation. The samples run on Linux, macOS and Windows, and the TypeScript sample also under Deno; every
# run must give the same findings as the Linux run under Node, except the differences listed in
# scripts/platforms/compare-runs.mjs, which docs/compatibility.md shows. The logic solver's tests run on Linux x64
# and arm64. Not a required check. It runs on a push to
# main that touches the paths below, by hand from the Actions tab, and on a pull request when the `run-ci` label is
# added and the pull request changes a file in the paths below, like the language end-to-end workflows.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'shared/**'
      - 'languages/**'
      - 'scripts/platforms/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/python-e2e-constraints.txt'
      - 'scripts/ci/**'
      - '.github/workflows/platforms.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# A newer request cancels the older run on the same pull request, other labels do not; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.label.name == 'run-ci' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Plain logs, and no Deno update check on every CLI start.
env:
  NO_COLOR: '1'
  DENO_NO_UPDATE_CHECK: '1'

jobs:
  # On a pull request, the jobs below run only when the pull request changes a file in this
  # workflow's push paths, or when the changed files cannot be listed. Other runs check everything.
  changes:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - id: select
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const { selectWorkflowJobs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/affected-jobs.mjs`);
            await selectWorkflowJobs({ github, context, core, workflow: '.github/workflows/platforms.yml' });

  samples:
    name: samples ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # Each Java sample builds twice with every Java tool; the job takes about five minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      UV_CONSTRAINT: ${{ github.workspace }}/.github/python-e2e-constraints.txt
    steps:
      # Windows runners turn LF into CRLF on checkout by default, which Prettier and the source hashes in finding
      # identities would report; the samples are compared with the Linux run byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # Maven comes with the runner image on all three systems.
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: languages/java/maven/fixtures/**/pom.xml
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: 8.14.3
          # Keep caching on the MIT implementation; v6 defaults to a proprietary provider.
          cache-provider: basic
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/python-e2e-constraints.txt
      # The Python sample builds its own environment with uv from its development dependencies.
      - run: pip install -c .github/python-e2e-constraints.txt uv
      - run: npm ci
      # Each sample's reports folder (report.txt, findings.json, tool-errors.json) goes into the artifact too.
      - name: Sample projects
        run: >-
          node scripts/platforms/smoke.mjs typescript gradle maven python
          --output "reports/platforms/${{ runner.os }}"
      # One artifact per system, replaced when a failed job is re-run, so the platforms job of a re-run
      # compares the newest run of every system.
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: platforms-${{ runner.os }}
          path: reports/platforms/
          overwrite: true
          if-no-files-found: warn

  runtimes:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.6
      - run: npm ci
      - run: node scripts/platforms/smoke.mjs typescript --output reports/runtimes/node
      - run: node scripts/platforms/smoke.mjs typescript --runtime deno --output reports/runtimes/deno
      # Stryker's first test run sometimes fails under Deno (about one run in four locally, never under
      # Node, cause not known yet; see docs/compatibility.md), so a differing Deno run gets one more try.
      - name: Deno gives the findings of Node
        run: |
          compare() {
            node scripts/platforms/compare-runs.mjs --report reports/runtimes/comparison.txt \
              reports/runtimes/node reports/runtimes/deno
          }
          if ! compare; then
            echo "::warning::The Deno run differed from Node; running the Deno sample once more."
            cat reports/runtimes/comparison.txt
            node scripts/platforms/smoke.mjs typescript --runtime deno --output reports/runtimes/deno
            compare
          fi
      # The expected differences and the tool error messages of each run.
      - name: Comparison
        if: ${{ !cancelled() }}
        run: cat reports/runtimes/comparison.txt || true
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: runtimes
          path: reports/runtimes/
          overwrite: true
          if-no-files-found: warn

  # The logic solver (shared/logic/decide.mjs) runs Z3 as WASM under a fixed resource limit, so it must give
  # the same answers on x64 and arm64; its tests run on both.
  logic-solver:
    name: logic solver ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run --config vitest.config.mts shared/logic/decide.test.mjs

  platforms:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.label.name == 'run-ci') }}
    needs: [changes, samples, runtimes, logic-solver]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.run == 'true'
      - uses: actions/setup-node@v7.1.0
        if: needs.changes.outputs.run == 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        if: needs.changes.outputs.run == 'true'
        with:
          pattern: platforms-*
          path: reports/platforms
          merge-multiple: true
      - name: macOS and Windows give the findings of Linux
        if: needs.changes.outputs.run == 'true'
        run: >-
          node scripts/platforms/compare-runs.mjs --report reports/comparison.txt
          reports/platforms/Linux reports/platforms/macOS reports/platforms/Windows
      - name: Comparison
        if: ${{ !cancelled() && needs.changes.outputs.run == 'true' }}
        run: cat reports/comparison.txt || true
      # The per-tool base and head counts and the new findings of every sample's change run, so a difference
      # can be read from the log without downloading the artifacts.
      - name: Change reports
        if: ${{ failure() && needs.changes.outputs.run == 'true' }}
        run: |
          for report in reports/platforms/*/*-reports/change/report.txt; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
      - name: Every sample, runtime and solver job passed, or the selection skipped them
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          SAMPLES: ${{ needs.samples.result }}
          RUNTIMES: ${{ needs.runtimes.result }}
          SOLVER: ${{ needs.logic-solver.result }}
        run: |
          test "$CHANGES" = success
          if [ "$RUN" = false ]; then exit 0; fi
          test "$SAMPLES" = success && test "$RUNTIMES" = success && test "$SOLVER" = success
