name: kotlin-e2e

# The Kotlin end-to-end suite (npm run test:kotlin): real Gradle and Maven builds of small Kotlin and Java
# projects (the runner's Maven), about 30 minutes. It runs on a push to main that touches the Java and Kotlin preset code, the core and
# shared code it imports, the package and test configuration, or this file; by hand from the Actions tab;
# and on a pull request only when the `run-ci` label is added, like the typescript workflow.
on:
  push:
    branches: [main]
    paths:
      - 'languages/java/**'
      - 'core/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - '.github/workflows/kotlin-e2e.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# A newer request cancels the older run on the same pull request, other labels do not; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.label.name == 'run-ci' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kotlin:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    # A healthy run takes about 30 minutes with cold Gradle and Maven caches; this stops a hung one well before the default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Caches ~/.gradle: the Kotlin compiler, detekt, ktlint, ktfmt, PMD, SpotBugs and PIT jars the init script
      # resolves, and the Kotlin Gradle plugin. Maven's tool jars land in ~/.m2, which a cold run downloads.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: npm ci
      - name: Kotlin end-to-end suite
        run: npm run test:kotlin
