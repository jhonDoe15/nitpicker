name: kotlin-e2e

# The Kotlin end-to-end suite (npm run test:kotlin): real Gradle builds of a small Kotlin and Java project,
# sharded across isolated runners. It runs on a push to main that touches the Java and Kotlin preset code, the core and
# shared code it imports, the package and test configuration, or this file; by hand from the Actions tab;
# and on a pull request when a label is added while it carries `run-ci` and it changes one of those paths.
on:
  push:
    branches: [main]
    paths:
      - 'languages/java/**'
      - 'core/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'nitpicker.config.json'
      - 'scripts/test-shards/**'
      - 'languages/typescript/adapters/test-runners/vitest/test-timeouts-setup.mts'
      - 'evals/**/*.test.mjs'
      - 'evals/**/*.test.mts'
      - 'scripts/ci/**'
      - '.github/workflows/kotlin-e2e.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# A newer run on the same pull request cancels the older one. On main a started
# run finishes, and a newer push replaces a run that is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request, the jobs below run only when the pull request changes a file in this
  # workflow's push paths, or when the changed files cannot be listed. Other runs check everything.
  changes:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - id: select
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const { selectWorkflowJobs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/affected-jobs.mts`);
            await selectWorkflowJobs({ github, context, core, workflow: '.github/workflows/kotlin-e2e.yml' });

  kotlin-shard:
    name: kotlin shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Files run serially inside each isolated shard to avoid competing JVM builds.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # Maven comes with the runner image. The Maven and Gradle dependency caches restore on every run and are
      # saved only on main. The primary key hashes the build files; the restore key falls back to the latest
      # entry of main, so a pull request that edits a build file still starts from main's cache and only
      # downloads what changed. setup-java and setup-gradle keep their own caching off to avoid a second save.
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - id: maven-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ~/.m2/repository
          key: kotlin-m2-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('languages/java/maven/fixtures/**/pom.xml', 'languages/java/gradle/nitpicker.init.gradle') }}
          restore-keys: |
            kotlin-m2-${{ runner.os }}-${{ matrix.shard }}-
      # The Kotlin compiler, detekt, ktlint, ktfmt, PMD, SpotBugs and PIT jars the init script resolves, and the plugins the fixture projects use.
      - id: gradle-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
          key: kotlin-gradle-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            kotlin-gradle-${{ runner.os }}-${{ matrix.shard }}-
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: 8.14.3
          # Keep the MIT implementation; v6 defaults to a proprietary provider. The cache steps above
          # hold the dependency cache, so setup-gradle neither restores nor saves one.
          cache-provider: basic
          cache-disabled: true
      - run: npm ci
      - name: Kotlin end-to-end suite
        run: npm run test:kotlin -- --no-file-parallelism --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=json --outputFile=reports/kotlin-e2e/shard-${{ matrix.shard }}.json
      - uses: actions/cache/save@v5.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.maven-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.m2/repository
          key: kotlin-m2-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('languages/java/maven/fixtures/**/pom.xml', 'languages/java/gradle/nitpicker.init.gradle') }}
      - uses: actions/cache/save@v5.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
          key: kotlin-gradle-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kotlin-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: reports/kotlin-e2e/
          if-no-files-found: warn

  # Lists the suite without starting a JVM build: test:kotlin must select every case its E2E flag enables,
  # and the timing profile and the matrix above must split those files with none missing or repeated.
  kotlin-shard-plan:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/test-shards/verify-e2e-shards.mts kotlin

  kotlin:
    if: ${{ always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')) }}
    needs: [changes, kotlin-shard-plan, kotlin-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Kotlin end-to-end shard and the shard plan passed, or the selection skipped them
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          PLAN: ${{ needs.kotlin-shard-plan.result }}
          RESULT: ${{ needs.kotlin-shard.result }}
        run: |
          test "$CHANGES" = success
          if [ "$RUN" = false ]; then exit 0; fi
          test "$PLAN" = success && test "$RESULT" = success
