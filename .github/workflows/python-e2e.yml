name: python-e2e

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'shared/**'
      - 'languages/python/**'
      - 'languages/java/ingest/**'
      - 'languages/java/adapters/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/python-e2e-constraints.txt'
      - '.github/workflows/python-e2e.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'shared/**'
      - 'languages/python/**'
      - 'languages/java/ingest/**'
      - 'languages/java/adapters/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/python-e2e-constraints.txt'
      - '.github/workflows/python-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-e2e:
    runs-on: ubuntu-latest
    # The suite installs pytest, mutmut and import-linter into throwaway environments and runs mutation
    # testing; it takes 8 to 25 minutes.
    timeout-minutes: 45
    env:
      # The suite's own `uv pip install` calls resolve to these versions too.
      UV_CONSTRAINT: ${{ github.workspace }}/.github/python-e2e-constraints.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/python-e2e-constraints.txt
      # The suite finds ruff, black, mypy, pyright, coverage, pytest and uv on the PATH and builds the
      # environments of its sample projects with uv.
      - run: pip install -c .github/python-e2e-constraints.txt black coverage mypy pyright pytest ruff uv
      - run: npm ci
      - run: npm run test:python
