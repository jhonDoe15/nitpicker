name: python-e2e

on:
  push:
    branches: [main]
    paths:
      - 'languages/python/**'
      - 'shared/rules/**'
      - 'shared/policy.mjs'
      - '.github/python-e2e-requirements.txt'
      - '.github/workflows/python-e2e.yml'
  pull_request:
    paths:
      - 'languages/python/**'
      - 'shared/rules/**'
      - 'shared/policy.mjs'
      - '.github/python-e2e-requirements.txt'
      - '.github/workflows/python-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-e2e:
    runs-on: ubuntu-latest
    # The suite installs pytest, mutmut and import-linter into throwaway environments and runs mutation
    # testing; it takes 10 to 25 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/python-e2e-requirements.txt
      # The suite finds ruff, black, mypy, pyright, coverage, pytest and uv on the PATH and builds the
      # environments of its sample projects with uv. lizard is not needed: the complexity comes from
      # Python's own ast module.
      - run: pip install -r .github/python-e2e-requirements.txt
      - run: npm ci
      - run: npm run test:python
