name: kotlin-metrics

# Re-reads the Kotlin fixtures with the pinned Kotlin compiler's parser (KotlinMetrics.java) when that program,
# its end-to-end test or the compiler pin changes. The pin is the `kotlinCompiler` line of nitpicker.init.gradle,
# so a change to any other line of that file starts the run and the first step ends it again. Kept apart from the
# typescript workflow so that it never runs for other pull requests.
on:
  push:
    branches: [main]
    paths:
      - 'languages/java/gradle/KotlinMetrics.java'
      - 'languages/java/gradle/nitpicker.init.gradle'
      - 'languages/java/adapters/kotlin-metrics.e2e.test.mjs'
      - '.github/workflows/kotlin-metrics.yml'
  pull_request:
    paths:
      - 'languages/java/gradle/KotlinMetrics.java'
      - 'languages/java/gradle/nitpicker.init.gradle'
      - 'languages/java/adapters/kotlin-metrics.e2e.test.mjs'
      - '.github/workflows/kotlin-metrics.yml'

# A new push to a pull request cancels its run still in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture-test:
    runs-on: ubuntu-latest
    # A healthy run takes about 5 minutes (it downloads the Kotlin compiler and Gradle plugins).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the parser or the compiler pin change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "unknown")
          pin=$(git diff "$BASE" HEAD -- languages/java/gradle/nitpicker.init.gradle 2>/dev/null | grep -cE '^[+-]\s*kotlinCompiler\s*:' || true)
          if [ "$changed" = "unknown" ] || echo "$changed" | grep -qvx 'languages/java/gradle/nitpicker.init.gradle' || [ "$pin" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only unrelated lines of nitpicker.init.gradle changed: the Kotlin compiler pin is the same."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.run == 'true'
        with:
          gradle-version: 8.14.3
      - run: npm ci
        if: steps.changes.outputs.run == 'true'
      - name: KotlinMetrics fixture test
        if: steps.changes.outputs.run == 'true'
        env:
          NITPICKER_KOTLIN_E2E: '1'
        run: npx vitest run --config vitest.config.mts --testTimeout=900000 --hookTimeout=900000 languages/java/adapters/kotlin-metrics.e2e.test.mjs
