name: github-release

# Manual only: builds, smoke-tests and pushes the container images of a commit on main to the
# registry set in container.yml, then publishes a GitHub release for that commit with the packed
# tarball and its checksum attached. It never publishes to npm.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the commit on main to release
        required: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the commit and read the version
        id: version
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          git merge-base --is-ancestor "$COMMIT" origin/main
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Builds the images from the commit, gates the sample projects in them and pushes them tagged with
  # the version; a stable release also moves the latest tags. The release below waits for them, so a
  # failing image stops the release. Re-running after a later failure pushes the same tags again.
  images:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      commit: ${{ inputs.commit }}
      version: ${{ needs.version.outputs.version }}
      publish: true
      latest: ${{ !inputs.prerelease }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The notes come from .github/release-notes/<tag>.md on main, or from the released commit.
      - name: Pack the tarball and checksum
        run: |
          mkdir release-assets
          npm pack --pack-destination release-assets
          (cd release-assets && shasum -a 256 nitpicker-*.tgz > SHA256SUMS)
          git show "origin/main:.github/release-notes/$TAG.md" > notes.md 2>/dev/null || cp ".github/release-notes/$TAG.md" notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release-assets/* --target "$COMMIT" --title "$TAG" --notes-file notes.md "${flags[@]}"
