name: go-e2e

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'shared/**'
      - 'languages/go/**'
      - 'languages/java/adapters/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'scripts/test-shards/**'
      - 'evals/**/*.test.mjs'
      - 'scripts/ci/**'
      - '.github/workflows/go-e2e.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# A newer request cancels the older run on the same pull request, other labels do not. On main a started
# run finishes, and a newer push replaces a run that is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || github.event.label.name == 'run-ci' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request, the jobs below run only when the pull request changes a file in this
  # workflow's push paths, or when the changed files cannot be listed. Other runs check everything.
  changes:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - id: select
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const { selectWorkflowJobs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/affected-jobs.mjs`);
            await selectWorkflowJobs({ github, context, core, workflow: '.github/workflows/go-e2e.yml' });

  go-shard:
    name: go shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # The suite runs the toolchain on the PATH; nitpicker builds gofumpt, goimports and its own
      # metrics program into ~/.cache/nitpicker on first use.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: npm ci
      - run: npm run test:go -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=json --outputFile=reports/go-e2e/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: reports/go-e2e/
          if-no-files-found: warn

  # Lists the suite without running Go: test:go must select every case its E2E flag enables, and the
  # timing profile and the matrix above must split those files with none missing or repeated.
  go-shard-plan:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/test-shards/verify-e2e-shards.mjs go

  go-e2e:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.label.name == 'run-ci') }}
    needs: [changes, go-shard-plan, go-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Go end-to-end shard and the shard plan passed, or the selection skipped them
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          PLAN: ${{ needs.go-shard-plan.result }}
          RESULT: ${{ needs.go-shard.result }}
        run: |
          test "$CHANGES" = success
          if [ "$RUN" = false ]; then exit 0; fi
          test "$PLAN" = success && test "$RESULT" = success
