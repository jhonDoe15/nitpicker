name: typescript

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'shared/**'
      - 'languages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'nitpicker.config.json'
      - '.npmrc'
      - 'spec/**'
      - 'evals/**'
      - 'skills/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/typescript.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# Pull requests are checked locally with `npm run check` (CONTRIBUTING.md). On a pull request CI runs
# only when the `run-ci` label is added; a newer request cancels the older run, other labels do not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.label.name == 'run-ci' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite runs in parallel jobs, each on its own shard of the test files (Vitest --shard), so the
  # slowest shard sets the time instead of the whole suite. The required `test` check is the job
  # below that passes only when every shard passed. scripts/test-shards/sequencer.mjs balances them.
  test-shard:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    name: test shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # A healthy shard takes 1 to 3 minutes; this stops a hung one well before the 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The StructureMetrics unit test runs Java on Java 21 sources, the version the Java preset needs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # One worker per vCPU: Vitest defaults to one fewer, and most tests wait on child processes.
      - run: npm test -- --maxWorkers=100% --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.label.name == 'run-ci') }}
    needs: test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test shard passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: test "$RESULT" = success

  # nitpicker gates its own repository: only new findings on lines a PR touches fail, everything
  # already in the merge base stays baselined. A separate job, not a step after the tests, because it
  # needs only `npm ci` (about 2 minutes), so it reports in parallel with the test shards
  # and a failing gate never hides test results (or the other way round). Not on main: there the
  # head is the base, so there is nothing to compare.
  self-gate:
    if: github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.label.name == 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the target branch must be reachable.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The CLI takes the base from GITHUB_BASE_REF on a pull request and origin/main on a manual run;
      # policy is nitpicker.config.json.
      # A loosening of nitpicker.config.json passes only when a repository admin sets the Actions
      # variable NITPICKER_ACCEPT_POLICY_CHANGE to the digest the finding names.
      - name: nitpicker on itself
        run: node core/cli.mjs --output reports/nitpicker
        env:
          NITPICKER_ACCEPT_POLICY_CHANGE: ${{ vars.NITPICKER_ACCEPT_POLICY_CHANGE }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nitpicker-report
          path: reports/nitpicker
