name: typescript

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'shared/**'
      - 'languages/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'nitpicker.config.json'
      - '.npmrc'
      - 'spec/**'
      - 'evals/**'
      - 'skills/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/typescript.yml'
      # docs/compatibility.md is generated from these; the staleness test checks it.
      - '.github/workflows/java-e2e.yml'
      - '.github/workflows/kotlin-e2e.yml'
      - '.github/workflows/python-e2e.yml'
      - '.github/workflows/platforms.yml'
      - '.github/python-e2e-constraints.txt'
      - 'docs/compatibility.md'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# Pull requests are checked locally with `npm run check` (CONTRIBUTING.md). On a pull request CI runs
# when a label is added while the pull request carries the `run-ci` label, and a newer run cancels the
# older one. GitHub keeps only the newest run of a workflow for a commit and counts a skipped required
# check as passed, so every label runs CI again instead of skipping: otherwise any label would hide a
# failed run behind skipped checks. Without `run-ci` the self-gate still runs and `test` fails.
# On main a started run finishes, and a newer push replaces a run that is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-smoke:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t nitpicker-smoke .
      - name: Gate the strict-clean project with mutation testing enabled
        run: |
          docker run --rm -i --entrypoint sh \
            -v "$PWD/languages/typescript/preset/fixtures/strict-clean:/fixture:ro" \
            nitpicker-smoke -eu <<'SMOKE'
          cp -R /fixture/. /work/
          printf 'node_modules/\nreports/\n' > .gitignore
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fixture = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tools = JSON.parse(fs.readFileSync('/opt/nitpicker/package.json', 'utf8')).devDependencies;
          for (const name of ['typescript', '@types/node', '@vitest/coverage-v8']) {
            fixture.devDependencies[name] = tools[name];
          }
          fs.writeFileSync('package.json', `${JSON.stringify(fixture, null, 2)}\n`);
          NODE
          npm install --legacy-peer-deps --no-audit --no-fund
          git init -q
          git config user.name container-smoke
          git config user.email container-smoke@example.invalid
          git add .gitignore package.json package-lock.json src test
          git commit -qm fixture
          nitpicker --all
          SMOKE

  # The suite runs in parallel jobs, each on its own shard of the test files (Vitest --shard), so the
  # slowest shard sets the time instead of the whole suite. The required `test` check is the job
  # below that passes only when every shard passed. scripts/test-shards/sequencer.mts balances them.
  test-shard:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    name: test shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # A healthy shard takes 6 to 9 minutes; this stops a hung one well before the 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The dependency hook tests install fixtures with the real pnpm, Yarn and Bun, whose versions
      # the fixtures pin; in CI a manager that is missing or has another version fails the test.
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      # The StructureMetrics unit test runs Java on Java 21 sources, the version the Java preset needs.
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # One worker per vCPU: Vitest defaults to one fewer, and most tests wait on child processes.
      - run: npm test -- --maxWorkers=100% --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  test:
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test shard passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$RESULT" = skipped ]; then
            echo "::error::The tests did not run: add the run-ci label to run CI on this pull request."
          fi
          test "$RESULT" = success

  # nitpicker gates its own repository: only new findings on lines a PR touches fail, everything
  # already in the merge base stays baselined. A separate job, not a step after the tests, because it
  # needs only `npm ci` (about 2 minutes), so it reports in parallel with the test shards
  # and a failing gate never hides test results (or the other way round). Not on main: there the
  # head is the base, so there is nothing to compare.
  self-gate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The merge base with the target branch must be reachable.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # A loosening of nitpicker.config.json passes only when a person with write access adds the
      # accept-policy-change label (nitpicker-policy-approval.yml records it on the head commit), or
      # when an admin sets the Actions variable NITPICKER_ACCEPT_POLICY_CHANGE to the digest the
      # finding names. These two steps are the ones of action.yml, which a test keeps in step.
      - name: Read the policy approval
        id: approval-status
        if: github.event.pull_request.head.sha != ''
        uses: actions/github-script@v8.0.0
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const scope = ` for #${process.env.PULL_REQUEST} into ${process.env.TARGET_BRANCH}`;
            try {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                ...context.repo,
                ref: sha,
                per_page: 100,
              });
              const latest = statuses.find(
                (status) =>
                  status.context === 'nitpicker/policy-accepted' &&
                  status.creator?.login === 'github-actions[bot]' &&
                  status.description?.endsWith(scope) === true,
              );
              core.setOutput('approved-sha', latest?.state === 'success' ? sha : '');
            } catch (error) {
              const message = `Could not read the policy approval of ${sha} (${error.message}). Give the job the statuses: read permission.`;
              core.info(message);
              core.setOutput('unreadable', message);
            }
      - name: Bind the policy approval to the checkout
        id: approval
        if: ${{ steps.approval-status.outputs.approved-sha != '' }}
        shell: bash
        env:
          APPROVED_SHA: ${{ steps.approval-status.outputs.approved-sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          merged="$(git rev-parse --verify --quiet 'HEAD^2' || true)"
          if [ "$head" = "$APPROVED_SHA" ] || { [ "$head" = "$GITHUB_SHA" ] && [ "$merged" = "$APPROVED_SHA" ]; }; then
            echo "acceptance=commit:$head" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=nitpicker::The policy approval is for ${APPROVED_SHA}, but the checkout is ${head}, so it accepts nothing in this run."
          fi
      # The CLI takes the base from GITHUB_BASE_REF on a pull request and origin/main on a manual run;
      # policy is nitpicker.config.json.
      - name: nitpicker on itself
        run: node core/cli.mjs --output reports/nitpicker
        env:
          NITPICKER_ACCEPT_POLICY_CHANGE: ${{ steps.approval.outputs.acceptance || vars.NITPICKER_ACCEPT_POLICY_CHANGE }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: nitpicker-report
          path: reports/nitpicker

  # Packs the tarball and installs it into consumer projects (hoisted, nested and linked layouts, and
  # one on TypeScript 7), then runs the gate from node_modules the way a user does. It catches what the
  # in-repository suite cannot: files missing from the package, paths inside node_modules and
  # git-ignored folders, and the peers a consumer brings. Not a required check. Node.js 22.14 is the
  # oldest supported version; its bundled npm 10 installs the repository from the lockfile.
  installed:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 22.14.0]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:installed
