name: typescript

on:
  push:
    branches: [main]
    paths:
      - 'typescript/**'
      - 'spec/**'
      - '.github/workflows/typescript.yml'
  pull_request:
    paths:
      - 'typescript/**'
      - 'spec/**'
      - '.github/workflows/typescript.yml'

# A new push to a pull request cancels its run still in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A healthy run takes 5 to 20 minutes; this stops a hung one well before the 6-hour default.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # Vitest defaults to one worker on a 2-vCPU runner, and most tests wait on child processes, so a
      # second worker keeps both cores busy.
      - run: npm test -- --maxWorkers=2
      - name: Conformance suite (spec/conformance)
        run: npm run test:conformance

  # nitpicker gates its own repository: only new findings on lines a PR touches fail, everything
  # already in the merge base stays baselined. A separate job, not a step after the tests, because it
  # needs only `npm ci` (about 2 minutes), so it reports in parallel with the 5 to 20 minute test job
  # and a failing gate never hides test results (or the other way round). Pull requests only: on a
  # push to main there is no base to compare with.
  self-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the target branch must be reachable.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # The CLI takes the base from GITHUB_BASE_REF (origin/<target branch>); policy is typescript/nitpicker.config.json.
      - name: nitpicker on itself
        run: node core/cli.mjs --output reports/nitpicker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nitpicker-report
          path: typescript/reports/nitpicker
