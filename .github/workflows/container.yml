name: container

# Builds each image variant of the Dockerfile and gates a sample project of every preset in it
# (.github/container-smoke). The github-release workflow calls this one with publish: true to push
# the same images to the registry named in env below. Not a required check.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'languages/typescript/preset/fixtures/strict-clean/**'
      - 'languages/javascript/preset/fixtures/js-clean/**'
      - 'languages/java/adapters/fixtures/gradle-project/**'
      - 'languages/java/adapters/fixtures/kotlin-project/**'
      - 'languages/java/maven/fixtures/single/**'
      - 'languages/python/adapters/fixtures/python-project/**'
      - '.github/container-smoke/**'
      - '.github/workflows/container.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Full SHA of the commit to build, if not the one the workflow runs on
        type: string
        default: ''
      version:
        description: Version the images are tagged with, for example 1.2.0
        type: string
        required: true
      publish:
        description: Push the images to the registry after they pass
        type: boolean
        default: false
      latest:
        description: Also move the latest tags (a stable release)
        type: boolean
        default: false

permissions:
  contents: read

# The registry and the image name under the repository owner. To publish elsewhere, change these and
# the login step of the publish job (docs/releasing.md, "Container images").
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nitpicker

# Pull requests are checked locally; CI runs on a pull request only when the `run-ci` label is added,
# and a newer request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.label.name == 'run-ci' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image ${{ matrix.variant }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: typescript
            cases: typescript javascript
          - variant: jvm
            cases: java-gradle java-maven kotlin
          - variant: python
            cases: python
          - variant: all
            cases: typescript java-maven python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          load: true
          provenance: false
          tags: nitpicker:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }}
      - name: Report the image size
        run: |
          size=$(docker image inspect nitpicker:${{ matrix.variant }} --format '{{.Size}}')
          echo "${{ matrix.variant }}: $((size / 1000000)) MB" >> "$GITHUB_STEP_SUMMARY"
      - name: Gate the sample projects in the image
        run: .github/container-smoke/run.sh nitpicker:${{ matrix.variant }} ${{ matrix.cases }}

  publish:
    name: publish ${{ matrix.variant }}
    if: ${{ inputs.publish }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [typescript, jvm, python, all]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The registry path must be lower case, and the owner name may not be.
      - name: Name the tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          VARIANT: ${{ matrix.variant }}
          LATEST: ${{ inputs.latest }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          tags="${image}:${VERSION}-${VARIANT}"
          if [ "$LATEST" = "true" ]; then tags+=$'\n'"${image}:latest-${VARIANT}"; fi
          if [ "$VARIANT" = "typescript" ]; then
            tags+=$'\n'"${image}:${VERSION}"
            if [ "$LATEST" = "true" ]; then tags+=$'\n'"${image}:latest"; fi
          fi
          { echo 'tags<<EOF'; echo "$tags"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      # The layers come from the cache the image job filled, so the pushed image is the tested one.
      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
