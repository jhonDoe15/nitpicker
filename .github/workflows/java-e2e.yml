name: java-e2e

# The Java end-to-end suite (npm run test:java): real Gradle and Maven builds of small Java projects, which
# exercise the formatter, Checkstyle and the followed project style for real. It runs on a push to main that
# touches the Java preset code, the core and shared code it imports, the package and test configuration, or
# this file; by hand from the Actions tab; and on a pull request only when the `run-ci` label is added, like
# the kotlin-e2e workflow.
on:
  push:
    branches: [main]
    paths:
      - 'languages/java/**'
      - 'core/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - '.github/workflows/java-e2e.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# A newer request cancels the older run on the same pull request, other labels do not; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.label.name == 'run-ci' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    # A healthy run takes well under an hour with cold Gradle and Maven caches; this stops a hung one well before the default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # Maven comes with the runner image; the cache keeps ~/.m2 between runs, keyed on the fixture poms.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: languages/java/maven/fixtures/**/pom.xml
      # Caches ~/.gradle: the Checkstyle, PMD, SpotBugs, Error Prone, palantir-java-format and PIT jars the init
      # script resolves, and the plugins the fixture projects use.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: npm ci
      - name: Java end-to-end suite
        run: npm run test:java
